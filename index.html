];
const EVENT_DISHES = EVENTS.flatMap(e => e.dishes);
const evById = id => EVENTS.find(e => e.id === id);
const mdNum = (m, d) => m * 100 + d;
function eventAt(t = Date.now()){
  const d = new Date(t), x = mdNum(d.getMonth() + 1, d.getDate());
  return EVENTS.find(e => { const a = mdNum(...e.from), b = mdNum(...e.to); return a <= b ? x >= a && x <= b : x >= a || x <= b; }) || null;
}
function nextEvent(t = Date.now()){
  const d = new Date(t); d.setHours(0, 0, 0, 0);
  for (let i = 1; i <= 366; i++){ const x = new Date(+d + i * 864e5), e = eventAt(x); if (e && (!eventAt(new Date(+x - 864e5)) || eventAt(new Date(+x - 864e5)).id !== e.id)) return {e, at:x}; }
  return null;
}
/* そのお店で使う材料（イベント中は季節メニューの材料も並ぶ） */
function shopIngs(st){
  const s = shopOf(st.shop), ev = evById(st.ev);
  if (!ev) return s.ings;
  const out = s.ings.slice(); ev.dishes.forEach(d => d.comps.forEach(c => { if (!out.includes(c)) out.push(c); }));
  return out;
}

/* =====================================================================
   ゲームのしくみ（ホストの端末だけが進めます。ほかの端末は結果を表示します）
   ===================================================================== */
const BURN = 9000;          // できあがりから こげるまで
/* やさしい：連打が少なく、焦げにくく、お客が長く待つ */
const isEasy = st => !!st && st.diff === 'easy';
const chopN = (c, st) => { const n = (ING[c].chop || 4) - upLv(st, 'knife'); return isEasy(st) ? Math.max(2, Math.ceil(n * .6)) : Math.max(2, n); };   // 何回たたくと切れるか
const burnMs = st => isEasy(st) ? BURN * 1.8 : BURN;
const mixN = st => isEasy(st) ? 2 : 3;       // 何周まぜるか
const washN = st => isEasy(st) ? 4 : 7;      // 何往復こするか
const on = (st, r) => !!st && (st.enabled || BASE_ROLES).includes(r);
const CAP = {cutq:4, cookq:4, mixq:4, tray:8};
const ACTIVE_STATES = ['wait'];
/* 仲間に送るひとこと */
const STAMPS = {thx:{t:'ありがとう', c:'#e2456f'}, nice:{t:'ナイス', c:'#2e9a6b'}, fast:{t:'急いで', c:'#e0913a'}, help:{t:'手伝って', c:'#3a87d4'}, wait:{t:'待って', c:'#8a7a6a'}, ok:{t:'了解', c:'#2b2520'}};

function newRoomState(code, hostPid){
  const wk = weekInfo();
  return {v:1, code, host:hostPid, phase:'lobby', now:Date.now(), seq:0,
    week:wk.w, shop:wk.shop.id, theme:wk.theme.id, stage:1,
    players:{}, orders:[], items:[], queue:[], cfg:null, fx:[], fxSeq:0,
    coins:0, served:0, missed:0, result:null, uid:1, diff:LSJ.get('nk:diff', 'normal'), off:LSJ.get('nk:off', []), quickN:LSJ.get('nk:quickN', 0), endAt:''};
}
const nid = st => 'i' + (st.uid++).toString(36);
const nextLoc = (st, c, s) => { const k = stepsOf(st, c)[s]; return k === 'cut' ? 'cutq' : k === 'cook' ? 'cookq' : k === 'mix' ? 'mixq' : 'tray'; };
const locCount = (st, loc) => st.items.filter(i => i.loc === loc).length;
function bump(st, pid, k){ if (!pid) return; st.stats = st.stats || {}; const s = st.stats[pid] = st.stats[pid] || {}; s[k] = (s[k] || 0) + 1; }
function fx(st, type, data = {}){ st.fx.push(Object.assign({id:++st.fxSeq, type, at:st.now}, data)); if (st.fx.length > 14) st.fx.splice(0, st.fx.length - 14); }
const activeOrders = st => st.orders.filter(o => o.state === 'wait').sort((a, b) => a.at - b.at);
const orderNeeds = (st, o) => { const d = dishOf(st.shop, o.dish), left = [...d.comps]; o.plate.forEach(c => { const i = left.indexOf(c); if (i >= 0) left.splice(i, 1); }); return left; };
const orderDone = (st, o) => orderNeeds(st, o).length === 0;
/* 料理ができて、飾りも終わっている（飾る係がいるとき） */
const orderReady = (st, o) => orderDone(st, o) && (!on(st, 'kazaru') || !!o.deco);

/* いま必要な材料の数（作っているとちゅうのものは差し引きます） */
function needCounts(st){
  const need = {};
  activeOrders(st).forEach(o => orderNeeds(st, o).forEach(c => { need[c] = (need[c] || 0) + 1; }));
  st.items.forEach(i => { if (need[i.c]) need[i.c]--; });
  Object.keys(need).forEach(k => { if (need[k] <= 0) delete need[k]; });
  return need;
}

function balanceRoles(st){
  st.extra = {};
  const ids = Object.keys(st.players).sort((a, b) => (st.players[a].joined || 0) - (st.players[b].joined || 0));
  if (ids.length <= 1) return;
  const en = st.enabled;
  const mine = id => (st.players[id].roles || []).filter(r => en.includes(r)).concat(st.extra[id] || []);
  const cnt = r => ids.filter(id => mine(id).includes(r)).length;
  /* 係を選んでいない（または今は使わない係だけの）人に、少ない係をわりあて */
  ids.forEach(id => {
    if (mine(id).length) return;
    const r = en.slice().sort((a, b) => cnt(a) - cnt(b))[0];
    st.extra[id] = [r];
  });
  /* だれも持っていない係は、受け持ちが少ない人へ */
  en.filter(r => !cnt(r)).forEach(r => {
    const id = ids.slice().sort((a, b) => mine(a).length - mine(b).length)[0];
    st.extra[id] = (st.extra[id] || []).concat(r);
  });
}
function startStage(st, n){
  st.enabled = enabledRoles(n, st.off || []);
  balanceRoles(st);
  const players = Math.max(1, Object.keys(st.players).length);
  const wk = weekInfo();
  if (wk.w !== st.week){ st.week = wk.w; st.shop = wk.shop.id; st.theme = wk.theme.id; }
  st.stage = n;
  st.up = Object.assign({}, LSJ.get('nk:up', {}));          // ホストの強化
  const ev = eventAt(); st.ev = ev ? ev.id : '';
  st.cfg = stageConfig(st.shop, st.week, n, players, ev);
  st.cfg.patience = Math.round(st.cfg.patience * (1 + .12 * upLv(st, 'chair')));
  if (isEasy(st)){ st.cfg.patience = Math.round(st.cfg.patience * 1.4); st.cfg.gap = Math.round(st.cfg.gap * 1.15); }
  const qn = st.quickN != null ? st.quickN : (st.quick ? 5 : 0);
  if (qn > 0 && qn < st.cfg.total){ st.cfg.queue = st.cfg.queue.slice(0, qn); st.cfg.total = qn; if (qn <= 6) st.cfg.rush = 0; }
  st.queue = st.cfg.queue.slice(); delete st.cfg.queue;
  st.orders = []; st.items = []; st.streak = 0; st.lastServe = 0; st.stats = {}; st.maxStreak = 0; st.hurryServed = 0;
  st.clean = on(st, 'arau') ? st.cfg.maxActive + 1 + 2 * upLv(st, 'plate') : null; st.fast = null; st.dishN = {}; st.sink = []; st.rushOn = false; st.coins = 0; st.served = 0; st.missed = 0; st.result = null;
  st.phase = 'intro'; st.introUntil = st.now + (st.cfg.newDish ? 6500 : 3500);
  fx(st, 'intro');
}

/* 時間の進み（ホストが 0.1 秒ごとに呼びます）。変化があれば true */
function tick(st, now){
  st.now = now;
  let ch = false;
  if (st.phase === 'intro' && now >= st.introUntil){ st.phase = 'play'; st.startAt = now; st.nextAt = now + 1200; fx(st, 'start'); ch = true; }
  if (st.phase !== 'play') return ch;
  const act = activeOrders(st);
  if (st.queue.length && act.length < st.cfg.maxActive + (st.queue[0].rush ? 1 : 0) && (now >= st.nextAt || act.length === 0 && now >= st.nextAt - st.cfg.gap + 2500)){
    const q = st.queue.shift(), pat = Math.round(st.cfg.patience * (q.hurry ? .55 : 1));
    const o = {id:nid(st), dish:q.dish, animal:q.animal, at:now, until:now + pat, pat, plate:[], state:'wait'};
    if (q.hurry) o.hurry = 1;
    st.orders.push(o); st.nextAt = now + st.cfg.gap * (q.rush ? .3 : 1); fx(st, 'arrive', {o:o.id}); ch = true;
    if (q.rush && !st.rushOn){ st.rushOn = true; fx(st, 'rush'); }
    if (!q.rush) st.rushOn = false;
  }
  for (const o of st.orders){
    if (o.state === 'wait' && now > o.until){ o.state = 'left'; o.leaveAt = now + 1800; st.missed++; fx(st, 'left', {o:o.id}); dirty(st, o); ch = true; }
  }
  const before = st.orders.length;
  st.orders = st.orders.filter(o => o.state === 'wait' || now < o.leaveAt);
  if (st.orders.length !== before) ch = true;
  for (const it of st.items){
    if (it.loc !== 'pan') continue;
    if (!it.done && now >= it.cs + cookMs(st, it.c)){ it.done = true; fx(st, 'cooked', {i:it.id}); ch = true; }
    if (!it.burnt && now >= it.cs + cookMs(st, it.c) + burnMs(st)){ it.burnt = true; fx(st, 'burnt', {i:it.id}); ch = true; }
  }
  if (!st.queue.length && !st.orders.length){
    const total = st.cfg.total, ratio = st.served / total;
    const stars = ratio >= .9 ? 3 : ratio >= .6 ? 2 : 1;
    st.result = {stars, served:st.served, total, coins:st.coins, stage:st.stage, shop:st.shop, week:st.week, stats:st.stats || {}, maxStreak:st.maxStreak || 0, hurryServed:st.hurryServed || 0, fast:st.fast || null, dishN:st.dishN || {}, ev:st.ev || ''};
    st.phase = 'result'; st.items = []; fx(st, 'result'); ch = true;
  }
  return ch;
}
function dirty(st, o){ if (o.pl && st.clean != null){ st.sink.push({id:nid(st), n:0}); o.pl = 0; } }
/* まないた・ボウルが空いたら、待っているものを自動でのせます */
function fillAll(st){ fillBoards(st); fillBowls(st); }
function fillBowls(st){
  for (let b = 0; b < bowlsN(st); b++){
    if (st.items.some(i => i.loc === 'bowl' && i.slot === b)) continue;
    const it = st.items.find(i => i.loc === 'mixq'); if (!it) return;
    it.loc = 'bowl'; it.slot = b; it.mix = 0;
  }
}
function fillBoards(st){
  for (let b = 0; b < boardsN(st); b++){
    if (st.items.some(i => i.loc === 'board' && i.slot === b)) continue;
    const it = st.items.find(i => i.loc === 'cutq'); if (!it) return;
    it.loc = 'board'; it.slot = b; it.chop = 0;
  }
}
function moveNext(st, it){
  it.s++; delete it.slot; delete it.chop; delete it.mix; delete it.cs; delete it.done; delete it.burnt;
  it.loc = nextLoc(st, it.c, it.s);
}

/* プレイヤーの操作を反映します。結果 {ok, why} */
function apply(st, a, pid){
  const P = st.players[pid];
  if (a.t === 'roles' && P){ P.roles = (a.roles || []).filter(r => ROLE_IDS.includes(r)); return {ok:true}; }
  if (a.t === 'start' && pid === st.host && (st.phase === 'lobby' || st.phase === 'result')){ startStage(st, Math.max(1, a.stage | 0 || st.stage)); return {ok:true}; }
  if (a.t === 'off' && pid === st.host && st.phase !== 'play' && st.phase !== 'intro'){ const s = new Set(st.off || []); if (s.has(a.r)) s.delete(a.r); else if (!BASE_ROLES.includes(a.r)) s.add(a.r); st.off = [...s]; return {ok:true}; }
  if (a.t === 'quick' && pid === st.host && st.phase !== 'play' && st.phase !== 'intro'){ st.quickN = Math.max(0, Math.min(40, a.n | 0)); st.endAt = a.end || ''; return {ok:true}; }
  if (a.t === 'diff' && pid === st.host && st.phase !== 'play' && st.phase !== 'intro'){ st.diff = a.v === 'easy' ? 'easy' : 'normal'; return {ok:true}; }
  if (a.t === 'lobby' && pid === st.host){ st.phase = 'lobby'; st.orders = []; st.items = []; st.result = null; return {ok:true}; }
  if (a.t === 'stamp' && P && STAMPS[a.k]){ if (st.now - (P.lastStamp || 0) < 900) return {ok:false}; P.lastStamp = st.now; fx(st, 'stamp', {k:a.k, p:pid}); return {ok:true}; }
  if (st.phase !== 'play') return {ok:false, why:'notplay'};
  const shop = shopOf(st.shop);
  const item = a.i ? st.items.find(i => i.id === a.i) : null;
  switch (a.t){
    case 'take': {
      if (!shopIngs(st).includes(a.c)) return {ok:false};
      const loc = nextLoc(st, a.c, 0);
      if (locCount(st, loc) >= CAP[loc]){ fx(st, 'full', {loc, p:pid}); return {ok:false, why:'full', loc}; }
      st.items.push({id:nid(st), c:a.c, s:0, loc, by:pid});
      fillAll(st); fx(st, 'take', {c:a.c, p:pid}); bump(st, pid, 'take');
      return {ok:true, loc};
    }
    case 'chop': {
      if (!item || item.loc !== 'board') return {ok:false};
      item.chop = (item.chop || 0) + 1;
      if (item.chop >= chopN(item.c, st)){ moveNext(st, item); fx(st, 'cut', {c:item.c, p:pid}); bump(st, pid, 'cut'); fillAll(st); }
      return {ok:true};
    }
    case 'stir': {
      if (!item || item.loc !== 'bowl') return {ok:false};
      item.mix = (item.mix || 0) + 1;
      if (item.mix >= mixN(st)){ moveNext(st, item); fx(st, 'mixed', {c:item.c, p:pid}); bump(st, pid, 'mix'); fillAll(st); }
      return {ok:true};
    }
    case 'scrub': {
      const d = st.sink && st.sink[0]; if (!d || d.id !== a.d) return {ok:false};
      d.n++;
      if (d.n >= washN(st)){ st.sink.shift(); st.clean++; fx(st, 'washed', {p:pid}); bump(st, pid, 'wash'); }
      return {ok:true};
    }
    case 'deco': {
      const o = st.orders.find(x => x.id === a.o);
      if (!o || o.state !== 'wait' || !orderDone(st, o) || o.deco) return {ok:false};
      o.deco = 1; o.decoQ = Math.max(0, Math.min(1, +a.q || 0));
      fx(st, 'deco', {o:o.id, p:pid}); bump(st, pid, 'deco');
      return {ok:true};
    }
    case 'cook': {
      if (!item || item.loc !== 'cookq') return {ok:false};
      const used = new Set(st.items.filter(i => i.loc === 'pan').map(i => i.slot));
      let slot = -1; for (let s = 0; s < pansN(st); s++) if (!used.has(s)){ slot = s; break; }
      if (slot < 0){ fx(st, 'full', {loc:'pan', p:pid}); return {ok:false, why:'full'}; }
      item.loc = 'pan'; item.slot = slot; item.cs = st.now; item.done = false;
      fx(st, 'cookin', {c:item.c, p:pid});
      return {ok:true};
    }
    case 'out': {
      if (!item || item.loc !== 'pan' || st.now < item.cs + cookMs(st, item.c)) return {ok:false};
      if (item.burnt){ st.items = st.items.filter(i => i !== item); fx(st, 'toss', {p:pid}); return {ok:true, burnt:true}; }
      moveNext(st, item); fillAll(st); fx(st, 'out', {c:item.c, p:pid}); bump(st, pid, 'cook');
      return {ok:true};
    }
    case 'plate': {
      if (!item || item.loc !== 'tray') return {ok:false};
      let o = a.o ? st.orders.find(x => x.id === a.o && x.state === 'wait' && orderNeeds(st, x).includes(item.c)) : null;
      if (!o) o = activeOrders(st).find(x => orderNeeds(st, x).includes(item.c));
      if (!o){ fx(st, 'nope', {i:item.id, p:pid}); return {ok:false, why:'nope'}; }
      if (st.clean != null && !o.pl){
        if (st.clean <= 0){ fx(st, 'noplate', {p:pid}); return {ok:false, why:'noplate'}; }
        st.clean--; o.pl = 1;
      }
      o.plate.push(item.c); st.items = st.items.filter(i => i !== item);
      fx(st, 'plate', {o:o.id, c:item.c, p:pid}); bump(st, pid, 'plate');
      return {ok:true, o:o.id};
    }
    case 'serve': {
      const o = st.orders.find(x => x.id === a.o);
      if (!o || o.state !== 'wait' || !orderReady(st, o)) return {ok:false};
      const d = dishOf(st.shop, o.dish), left = Math.max(0, (o.until - st.now) / (o.pat || st.cfg.patience));
      /* 続けて出すと連続ボーナス */
      st.streak = st.now - (st.lastServe || 0) < 12000 ? (st.streak || 0) + 1 : 1; st.lastServe = st.now;
      const coins = Math.round((d.comps.length * 10 + Math.round(left * 10) * 2 + (o.deco ? 5 + Math.round(o.decoQ * 10) : 0)) * (o.hurry ? 1.5 : 1)) + (st.streak >= 2 ? Math.min(5, st.streak - 1) * 5 : 0);
      const coinsT = Math.round(coins * (1 + .1 * upLv(st, 'tip')));
      const ms = st.now - o.at; if (!st.fast || ms < st.fast.ms) st.fast = {ms, dish:o.dish, p:pid};
      st.dishN = st.dishN || {}; st.dishN[o.dish] = (st.dishN[o.dish] || 0) + 1;
      o.state = 'happy'; o.leaveAt = st.now + 1800; o.coins = coinsT;
      st.coins += coinsT; st.served++;
      st.maxStreak = Math.max(st.maxStreak || 0, st.streak); if (o.hurry) st.hurryServed = (st.hurryServed || 0) + 1;
      fx(st, 'serve', {o:o.id, coins:coinsT, p:pid, streak:st.streak, dish:o.dish}); bump(st, pid, 'serve'); dirty(st, o);
      return {ok:true};
    }
    case 'trash': {
      if (!item || !['tray', 'cutq', 'cookq', 'mixq', 'pan'].includes(item.loc)) return {ok:false};
      st.items = st.items.filter(i => i !== item); fx(st, 'trash', {p:pid});
      return {ok:true};
    }
  }
  return {ok:false};
}

/* その人の画面に出す係（自分で選んだ係＋わりあてられた係＋だれも持っていない係） */
function myStations(st, pid){
  const en = st.enabled || BASE_ROLES, ids = Object.keys(st.players);
  const has = id => ((st.players[id].roles || []).filter(r => en.includes(r))).concat((st.extra || {})[id] || []);
  if (ids.length <= 1) return en.slice();
  const owned = new Set(); ids.forEach(id => has(id).forEach(r => owned.add(r)));
  const mine = new Set(st.players[pid] ? has(pid) : []);
  en.forEach(r => { if (!owned.has(r)) mine.add(r); });
  if (!mine.size) en.forEach(r => mine.add(r));
  return ROLE_IDS.filter(r => mine.has(r));
}

/* =====================================================================
   オンライン（ログインなし・合言葉の部屋）
   Firestore：nakayoshiKitchen/{合言葉}            … ゲームの状態（ホストだけが書きます）
             nakayoshiKitchen/{合言葉}/p/{id}     … 参加している人（名前・係・きせかえ）
             nakayoshiKitchen/{合言葉}/a/{id}     … 操作（ホストが読み取って反映します）
   ===================================================================== */
const ROOT = 'nakayoshiKitchen';
const NET = {mode:'off', code:'', isHost:false, st:null, unsub:[], processed:new Set(), pushT:null, lastPush:0, loopT:null, hbT:null,
  lastRecv:0, lastUpd:0, offset:0, pdocs:{}, actN:0, hostSince:0, onChange:null};
const PID = (() => { let p = localStorage.getItem('nk:pid'); if (!p){ p = 'p' + Math.random().toString(36).slice(2, 9); localStorage.setItem('nk:pid', p); } return p; })();
const hostNow = () => Date.now() + (NET.isHost ? 0 : NET.offset);
function whenFB(){ return new Promise((res, rej) => { if (window.FBX) return res(); const to = setTimeout(() => rej(new Error('offline')), 9000); window.addEventListener('fbx-ready', () => { clearTimeout(to); res(); }, {once:true}); }); }
const roomRef = code => FBX.doc(FBX.db, ROOT, code);
const meDoc = () => ({name:ME.name, color:ME.color, hat:ME.hat, skin:ME.skin, roles:ME.roles, joined:NET.joined || Date.now(), last:Date.now()});

function netChanged(){
  const st = NET.st; if (!st) return;
  st.seq++;
  if (NET.onChange) NET.onChange();
  if (NET.mode === 'room' && NET.isHost) schedulePush();
}
function schedulePush(force){
  clearTimeout(NET.pushT);
  const wait = force ? 0 : Math.max(0, 300 - (Date.now() - NET.lastPush));
  NET.pushT = setTimeout(pushState, wait);
}
async function pushState(){
  if (NET.mode !== 'room' || !NET.isHost || !NET.st) return;
  NET.lastPush = Date.now(); NET.st.now = Date.now();
  try{ await FBX.setDoc(roomRef(NET.code), {s:JSON.stringify(NET.st), host:PID, upd:Date.now()}); }
  catch(e){ console.warn('push', e); }
}
/* ホストの進行（0.1秒ごと） */
function hostLoop(){
  clearInterval(NET.loopT);
  NET.loopT = setInterval(() => {
    const st = NET.st; if (!st || !NET.isHost) return;
    let ch = tick(st, Date.now());
    if (NET.mode === 'room'){
      // しばらく応答のない人は、部屋から外します
      const now = Date.now();
      Object.keys(st.players).forEach(id => { if (id !== PID && (!NET.pdocs[id] || now - NET.pdocs[id].last > 25000)){ delete st.players[id]; ch = true; } });
      if (now - NET.lastPush > 2500) schedulePush();
    }
    if (ch) netChanged();
  }, 100);
}
function stopNet(){
  NET.unsub.forEach(f => { try{ f(); }catch(e){} }); NET.unsub = [];
  clearInterval(NET.loopT); clearInterval(NET.hbT); clearTimeout(NET.pushT);
  NET.mode = 'off'; NET.isHost = false; NET.st = null; NET.code = ''; NET.pdocs = {}; NET.processed = new Set();
}

/* ---------- ひとりで ---------- */
function soloStart(){
  stopNet();
  NET.mode = 'solo'; NET.isHost = true; NET.joined = Date.now();
  NET.st = newRoomState('', PID);
  NET.st.players[PID] = Object.assign(meDoc(), {roles:ROLE_IDS.slice()});
  NET.st.stage = nextStageFor(NET.st.week);
  hostLoop();
}

/* ---------- 部屋をつくる ---------- */
async function createRoom(){
  await whenFB();
  stopNet();
  let code = '';
  for (let i = 0; i < 12; i++){
    const c = String(1000 + Math.floor(Math.random() * 9000));
    const snap = await FBX.getDoc(roomRef(c));
    if (!snap.exists() || Date.now() - (snap.data().upd || 0) > 6 * 3600e3){ code = c; break; }
  }
  if (!code) throw new Error('部屋を作れなかった');
  NET.mode = 'room'; NET.code = code; NET.isHost = true; NET.joined = Date.now(); NET.hostSince = Date.now();
  NET.st = newRoomState(code, PID);
  NET.st.players[PID] = meDoc();
  NET.st.stage = nextStageFor(NET.st.week);
  await FBX.setDoc(roomRef(code), {s:JSON.stringify(NET.st), host:PID, upd:Date.now()});
  await FBX.setDoc(FBX.doc(FBX.db, ROOT, code, 'p', PID), meDoc());
  subscribe();
  hostLoop();
  return code;
}
/* ---------- 部屋にはいる ---------- */
async function joinRoom(code){
  await whenFB();
  stopNet();
  const snap = await FBX.getDoc(roomRef(code));
  if (!snap.exists() || Date.now() - (snap.data().upd || 0) > 6 * 3600e3) throw new Error('nf');
  NET.mode = 'room'; NET.code = code; NET.joined = Date.now();
  const st = JSON.parse(snap.data().s);
  NET.isHost = st.host === PID;
  NET.st = st; NET.offset = (st.now || Date.now()) - Date.now(); NET.lastRecv = Date.now();
  await FBX.setDoc(FBX.doc(FBX.db, ROOT, code, 'p', PID), meDoc());
  subscribe();
  if (NET.isHost){ NET.hostSince = Date.now(); hostLoop(); }
}
function subscribe(){
  const code = NET.code;
  NET.unsub.push(FBX.onSnapshot(roomRef(code), snap => {
    if (!snap.exists()) return;
    const d = snap.data();
    NET.lastRecv = Date.now();
    if (NET.isHost && d.host === PID) return;                 // 自分が書いたもの
    if (NET.isHost && d.host !== PID){ NET.isHost = false; clearInterval(NET.loopT); }   // ほかの人がホストを引きついだ
    let st; try{ st = JSON.parse(d.s); }catch(e){ return; }
    NET.offset = (st.now || d.upd) - Date.now();
    NET.st = st;
    if (NET.onChange) NET.onChange();
  }));
  NET.unsub.push(FBX.onSnapshot(FBX.collection(FBX.db, ROOT, code, 'p'), snap => {
    const m = {}; snap.forEach(x => { m[x.id] = x.data(); });
    NET.pdocs = m;
    if (NET.isHost && NET.st){
      let ch = false;
      Object.entries(m).forEach(([id, p]) => {
        if (Date.now() - (p.last || 0) > 25000 && id !== PID) return;
        const cur = NET.st.players[id], keep = cur && cur.auto && !(p.roles && p.roles.length);
        const np = {name:p.name, color:p.color, hat:p.hat, skin:p.skin, roles:keep ? cur.roles : (p.roles || []), joined:p.joined || 0};
        if (keep) np.auto = true;
        if (!cur || JSON.stringify(cur) !== JSON.stringify(np)){ NET.st.players[id] = np; ch = true; }
      });
      if (ch) netChanged();
    }
  }));
  NET.unsub.push(FBX.onSnapshot(FBX.collection(FBX.db, ROOT, code, 'a'), snap => {
    if (!NET.isHost || !NET.st) { snap.forEach(x => NET.processed.add(x.id)); return; }
    let ch = false;
    snap.forEach(x => {
      if (NET.processed.has(x.id)) return;
      NET.processed.add(x.id);
      const v = x.data(); if (!v || v.t < NET.hostSince - 4000) return;
      let a; try{ a = JSON.parse(v.a); }catch(e){ return; }
      NET.st.now = Date.now();
      apply(NET.st, a, v.p); ch = true;
    });
    if (ch) netChanged();
  }));
  clearInterval(NET.hbT);
  NET.hbT = setInterval(() => {
    if (NET.mode !== 'room') return;
    FBX.setDoc(FBX.doc(FBX.db, ROOT, NET.code, 'p', PID), {last:Date.now()}, {merge:true}).catch(() => {});
    checkTakeover();
  }, 4000);
}
/* ホストの端末がいなくなったら、いちばん先に入った人が引きつぎます */
function checkTakeover(){
  if (NET.isHost || NET.mode !== 'room' || !NET.st) return;
  if (Date.now() - NET.lastRecv < 9000) return;
  const now = Date.now();
  const alive = Object.entries(NET.pdocs).filter(([id, p]) => id !== NET.st.host && now - (p.last || 0) < 12000).sort((a, b) => (a[1].joined || 0) - (b[1].joined || 0));
  if (!alive.length || alive[0][0] !== PID) return;
  NET.isHost = true; NET.hostSince = Date.now();
  const st = NET.st; st.host = PID; st.now = Date.now();
  if (st.phase === 'play') Object.values(st.orders).forEach(o => { if (o.state === 'wait') o.until += 6000; });   // 待たせたぶん、少しのばします
  fx(st, 'host', {p:PID});
  hostLoop(); schedulePush(true);
  if (NET.onChange) NET.onChange();
}
/* 操作を送ります（ホストならその場で反映） */
function send(a){
  if (!NET.st) return {ok:false};
  if (NET.isHost){ NET.st.now = Date.now(); const r = apply(NET.st, a, PID); netChanged(); return r; }
  const id = `${PID}-${Date.now().toString(36)}-${(NET.actN++).toString(36)}`;
  FBX.setDoc(FBX.doc(FBX.db, ROOT, NET.code, 'a', id), {p:PID, a:JSON.stringify(a), t:Date.now()}).catch(e => console.warn('act', e));
  return {ok:true, pending:true};
}
function updateMe(){
  if (!NET.st) return;
  if (NET.mode === 'room') FBX.setDoc(FBX.doc(FBX.db, ROOT, NET.code, 'p', PID), meDoc(), {merge:true}).catch(() => {});
  if (NET.isHost){ const cur = NET.st.players[PID] || {}; NET.st.players[PID] = Object.assign(cur, meDoc(), NET.mode === 'solo' ? {roles:ROLE_IDS.slice()} : {}); netChanged(); }
}
async function leaveRoom(){
  if (NET.mode === 'room' && window.FBX){ try{ await FBX.deleteDoc(FBX.doc(FBX.db, ROOT, NET.code, 'p', PID)); }catch(e){} }
  stopNet();
}

const SND = {ctx:null, master:null, sfx:null, bgm:null, on:localStorage.getItem('nk:sound') !== '0', music:localStorage.getItem('nk:music') !== '0', bgmT:null, step:0, song:-1, nextT:0};
function actx(){
  if (!SND.ctx){
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null;
    SND.ctx = new AC(); SND.master = SND.ctx.createGain(); SND.master.gain.value = .9; SND.master.connect(SND.ctx.destination);
    SND.sfx = SND.ctx.createGain(); SND.sfx.gain.value = .8; SND.sfx.connect(SND.master);
    SND.bgm = SND.ctx.createGain(); SND.bgm.gain.value = .16; SND.bgm.connect(SND.master);
  }
  if (SND.ctx.state !== 'running') SND.ctx.resume();
  return SND.ctx;
}
document.addEventListener('pointerdown', () => { const c = actx(); if (c){ const b = c.createBuffer(1, 1, 22050), s = c.createBufferSource(); s.buffer = b; s.connect(c.destination); s.start(0); } }, {passive:true});
function tone(f, t, d, type = 'sine', v = .3, out, slide){
  const c = SND.ctx, o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + d);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .012); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g).connect(out || SND.sfx); o.start(t); o.stop(t + d + .05);
}
let noiseBuf = null;
function noise(t, d, v = .3, freq = 2000, q = 1, out){
  const c = SND.ctx;
  if (!noiseBuf){ noiseBuf = c.createBuffer(1, c.sampleRate * .5, c.sampleRate); const ch = noiseBuf.getChannelData(0); for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1; }
  const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
  s.buffer = noiseBuf; f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  s.connect(f).connect(g).connect(out || SND.sfx); s.start(t); s.stop(t + d + .05);
}
const SFX = {
  tap:t => tone(880, t, .08, 'sine', .18),
  pop:t => { tone(520, t, .12, 'sine', .28, null, 980); },
  take:t => { tone(660, t, .1, 'triangle', .25); tone(990, t + .06, .12, 'sine', .2); },
  chop:t => { noise(t, .07, .5, 3200, 2); tone(180, t, .06, 'square', .08); },
  cut:t => { noise(t, .06, .4, 3600, 2); tone(784, t + .05, .12, 'sine', .22); tone(1175, t + .12, .16, 'sine', .2); },
  cookin:t => { noise(t, .35, .18, 1200, .6); tone(330, t, .1, 'sine', .15); },
  cooked:t => { [1318, 1760].forEach((f, i) => tone(f, t + i * .12, .35, 'sine', .22)); },
  out:t => { tone(587, t, .1, 'triangle', .25); tone(880, t + .07, .14, 'triangle', .22); },

  nope:t => { tone(220, t, .14, 'square', .1); tone(196, t + .12, .16, 'square', .1); },

  start:t => { [523, 659, 784].forEach((f, i) => tone(f, t + i * .12, .2, 'square', .1)); tone(1046, t + .38, .5, 'square', .12); },

];
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
function bgmStart(i){
  if (!SND.music || !SND.on){ bgmStop(); return; }
  const c = actx(); if (!c) return;
  if (SND.song === i && SND.bgmT) return;
  bgmStop(); SND.song = i; SND.step = 0; SND.nextT = c.currentTime + .1;
  SND.bgmT = setInterval(() => {
    const song = SONGS[SND.song] || SONGS[0], spb = 60 / song.bpm / 2;
    while (SND.nextT < c.currentTime + .25){
      const s = SND.step, t = SND.nextT, bar = Math.floor(s / 8) % song.prog.length, ch = song.prog[bar];
      const m = song.mel[s % song.mel.length];
      if (m) { tone(mtof(m), t, .32, 'sine', .32, SND.bgm); tone(mtof(m + 12), t, .12, 'sine', .06, SND.bgm); }
      if (s % 4 === 0) tone(mtof(ch[0] - 12), t, .5, 'triangle', .38, SND.bgm);
      if (s % 4 === 2) ch.forEach(n => tone(mtof(n), t, .18, 'sine', .08, SND.bgm));
      if (s % 2 === 1) noise(t, .03, .12, 8000, 1, SND.bgm);
      SND.step++; SND.nextT += spb;
    }
  }, 60);
}
function bgmStop(){ clearInterval(SND.bgmT); SND.bgmT = null; SND.song = -1; }

let toastT = null;
function toastMsg(m){ const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2200); }
let curScreen = '';
function show(id){ curScreen = id; $$('.screen').forEach(s => s.classList.toggle('on', s.id === id)); }
function overlay(html, cls = ''){ const o = $('#ov'); o.innerHTML = `<div class="overlay ${cls}"><div class="card ovcard">${html}</div></div>`; return o.firstElementChild; }
function closeOv(){ $('#ov').innerHTML = ''; }
function ask(msg, ok = 'OK', no = 'キャンセル'){
  return new Promise(res => {
    const o = overlay(`<h3 style="font-size:20px">${esc(msg)}</h3><div class="ov-btns"><button class="btn" data-r="0">${esc(no)}</button><button class="btn green" data-r="1">${esc(ok)}</button></div>`, 'dialog');
    o.onclick = e => { const b = e.target.closest('[data-r]'); if (b){ closeOv(); res(b.dataset.r === '1'); } };
  });
}
let themeKey = '';
function applyShop(shopId, themeId){
  const k = shopId + ':' + themeId; if (k === themeKey) return; themeKey = k;
  const s = shopOf(shopId), th = THEMES.find(t => t.id === themeId) || THEMES[0], r = document.body.style;
  r.setProperty('--sign', s.pal.sign); r.setProperty('--accent', s.pal.accent);
  document.body.dataset.theme = th.id; document.body.dataset.shop = s.id;
  $('meta[name=theme-color]').content = th.id === 'night' ? '#1c202b' : '#f4eee6';
  const d = $('#deco'); d.innerHTML = '';
  if (th.id === 'night') d.innerHTML = `<div class="lights">${Array.from({length:22}, (_, i) => `<i style="left:${i * 4.7 + 1}%;top:${8 + Math.sin(i) * 5}px;--c:${['#ffd34d', '#ff8fa0', '#7fd6ff', '#9be39b'][i % 4]}"></i>`).join('')}</div>`;
  if (th.id === 'fes') d.innerHTML = Array.from({length:9}, (_, i) => `<div class="lantern" style="left:${4 + i * 11.5}%"></div>`).join('');
  if (th.id === 'snow') d.innerHTML = Array.from({length:36}, (_, i) => `<i class="flake" style="left:${(i * 37) % 100}%;top:${(i * 53) % 96}%;--s:${3 + (i % 4) * 2}px"></i>`).join('');
}

function drawCode(){ $('#jCode').innerHTML = [0, 1, 2, 3].map(i => `<span class="${i === joinCode.length ? 'cur' : ''}">${joinCode[i] || ''}</span>`).join(''); }
async function doJoin(){
  if (joinCode.length !== 4){ $('#jErr').textContent = '4桁を入力'; sfx('nope'); return; }
  $('#jErr').textContent = '検索中…';
  try{ await joinRoom(joinCode); NET.onChange = onNet; renderLobby(); onNet(); }
  catch(err){ $('#jErr').textContent = err.message === 'nf' ? '部屋が見つからない' : err.message === 'offline' ? 'オフライン' : '入れなかった'; sfx('nope'); }
}
$('#join').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  sfx('tap');
  if (b.dataset.a === 'back') return renderTitle();
  const n = b.dataset.n; if (n == null) return;
  if (n === 'del') joinCode = joinCode.slice(0, -1);
  else if (n === 'go') return doJoin();
  else if (joinCode.length < 4) joinCode += n;
  $('#jErr').textContent = ''; drawCode();
  if (joinCode.length === 4) doJoin();
});

let qrCache = {};
function loadQR(){ return window.qrcode ? Promise.resolve() : new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js'; s.onload = res; s.onerror = rej; document.head.append(s); }); }
async function qrFor(code){
  if (qrCache[code]) return qrCache[code];
  try{ await loadQR(); const q = qrcode(0, 'M'); q.addData(location.origin + location.pathname + '?room=' + code); q.make(); qrCache[code] = q.createDataURL(5, 1); }catch(e){ qrCache[code] = ''; }
  return qrCache[code];
}

$('#lobby').addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  sfx('tap');
  if (b.dataset.a === 'leave'){ if (NET.mode === 'room' && !(await ask('部屋から出る？', '出る'))) return; await leaveRoom(); renderTitle(); return; }
  if (b.dataset.a === 'sp-'){ lobbyStage = Math.max(1, lobbyStage - 1); renderLobby(); }
  if (b.dataset.a === 'sp+'){ lobbyStage = Math.min(nextStageFor(NET.st.week), lobbyStage + 1); renderLobby(); }
  if (b.dataset.a === 'start') send({t:'start', stage:lobbyStage});
  if (b.dataset.a === 'off'){ const s = new Set(NET.st.off || []); if (s.has(b.dataset.r)) s.delete(b.dataset.r); else s.add(b.dataset.r); LSJ.set('nk:off', [...s]); send({t:'off', r:b.dataset.r}); if (NET.isHost) renderLobby(); return; }
  if (b.dataset.a === 'quick'){
    if (b.dataset.v === 'time'){ askEndTime(); return; }
    const n = +b.dataset.v || 0; LSJ.set('nk:quickN', n); send({t:'quick', n}); if (NET.isHost) renderLobby(); return; }
  if (b.dataset.a === 'diff'){ LSJ.set('nk:diff', b.dataset.v); send({t:'diff', v:b.dataset.v}); if (NET.isHost) renderLobby(); }
  if (b.dataset.role){
    const r = b.dataset.role, set = new Set(ME.roles || []);
    set.has(r) ? set.delete(r) : set.add(r);
    ME.roles = ROLE_IDS.filter(x => set.has(x)); saveMe(); updateMe(); sfx('pop');
    if (NET.st.players[PID]){ NET.st.players[PID].roles = ME.roles; delete NET.st.players[PID].auto; }
    renderLobby();
  }
});

/* =========================================================
   ネットの変化 → 画面
   ========================================================= */
let lastPhase = '', lastFx = -1, resultDone = '';
function onNet(){
  const st = NET.st; if (!st) return;
  applyShop(st.shop, st.theme);
  if (lastFx < 0) lastFx = st.fxSeq || 0;
  handleFx(st);
  if (st.phase === 'lobby'){
    if (lastPhase !== 'lobby' || curScreen !== 'lobby'){ closeOv(); bgmStop(); endDrag(true); }
    if (curScreen === 'lobby' || lastPhase !== 'lobby') renderLobby();
  } else {
    if (curScreen !== 'play'){ show('play'); buildPlay(true); }
    renderPlay();
    if (st.phase === 'intro' && lastPhase !== 'intro') showIntro();
    if (st.phase === 'play' && lastPhase === 'intro') closeOv();
    if (st.phase === 'result' && lastPhase !== 'result'){ endDrag(true); showResult(); }
  }
  lastPhase = st.phase;
}
function banner(t, cls = ''){
  const b = document.createElement('div'); b.className = 'banner ' + cls; b.textContent = t;
  document.body.append(b); setTimeout(() => b.remove(), 1700);
}
function handleFx(st){
  const mineSt = myStations(st, PID);
  for (const f of st.fx || []){
    if (f.id <= lastFx) continue;
    lastFx = f.id;
    if (f.type === 'arrive') sfx('arrive');

  g.style.left = p.x + 'px'; g.style.top = p.y + 'px';

}

let lastGain = null;
const _recordResult = recordResult;
recordResult = function(r){
  const unlocked = _recordResult(r);
  const gain = {coins:r.coins, newBook:[], stamp:null};
  WALLET.add(r.coins);
  const book = BOOK();
  Object.entries(r.dishN || {}).forEach(([id, n]) => { if (!book[id]) gain.newBook.push(id); book[id] = (book[id] || 0) + n; });
  LSJ.set('nk:book', book);
  const sp = STAMP(), tk = todayKey();
  if (sp.last !== tk){
    sp.last = tk; sp.n++; let bonus = 50, full = false;
    if (sp.n >= 7){ sp.n = 0; sp.cards++; bonus += 300; full = true; LSJ.set('nk:gold', true); }
    LSJ.set('nk:stamp', sp); WALLET.add(bonus);
    gain.stamp = {n:full ? 7 : sp.n, bonus, full};
  }
  lastGain = gain;
  return unlocked;
};

  const it = $('#mgPan .it'); if (it) it.style.filter = `brightness(${1.1 - MG.pos / 160}) saturate(${1 - MG.pos / 300})`;
  MG.raf = requestAnimationFrame(bakeLoop);
}
$('#mini').addEventListener('click', e => {
  if (!MG || MG.id !== 'bake' || !e.target.closest('#mgStop') || MG.lock) return;
  MG.lock = true; cancelAnimationFrame(MG.raf);
  const ok = MG.pos >= MG.zone[0] && MG.pos <= MG.zone[1], it = $('#mgPan .it');
  if (ok){ MG.score++; $('#mgScore').textContent = MG.score; sfx('serve'); it.innerHTML = A.patty_ready(); it.style.filter = ''; toastMsg('ちょうどいい'); }
  else { sfx('nope'); toastMsg(MG.pos < MG.zone[0] ? 'まだ生焼け' : '焼きすぎ'); }
  MG.round++;
  setTimeout(() => { if (!MG || MG.id !== 'bake') return; if (MG.round >= 8) return miniEnd(MINI.find(x => x.id === 'bake'), MG.score); $('#mgTime').textContent = `${MG.round + 1}/8`; bakeRound(); }, 800);
});
$('#mini').addEventListener('pointerdown', e => {
  if (!MG || MG.id !== 'deco') return;
  const db = e.target.closest('#mgDeco'); if (!db) return;
  const G = decoGeom(db), u = [(e.clientX - G.x0) / G.s, (e.clientY - G.y0) / G.s];
  if (Math.hypot(u[0] - MG.pts[0][0], u[1] - MG.pts[0][1]) > 16){ toastMsg('大きい丸から'); return; }
  if (!MG.started){ MG.started = true; const tm = $('.tapme', db); if (tm) tm.remove(); miniTimer(MINI.find(x => x.id === 'deco'), 15, () => miniEnd(MINI.find(x => x.id === 'deco'), MG.score)); }
  MG.tr = {G}; MG.next = 1; MG.path = [u]; $$('.cp', db).forEach(c => c.classList.toggle('hit', c.dataset.n === '0'));
});
window.addEventListener('pointermove', e => {
  if (!MG || MG.id !== 'deco' || !MG.tr) return;
  const db = $('#mgDeco'), G = MG.tr.G, u = [(e.clientX - G.x0) / G.s, (e.clientY - G.y0) / G.s];
  MG.path.push(u); const ink = $('.ink', db); if (ink) ink.setAttribute('points', MG.path.map(p => p.map(v => v.toFixed(1)).join(',')).join(' '));
  if (MG.next < MG.pts.length && Math.hypot(u[0] - MG.pts[MG.next][0], u[1] - MG.pts[MG.next][1]) < 11){ const c = $(`.cp[data-n="${MG.next}"]`, db); if (c) c.classList.add('hit'); MG.next++; sfx('tap'); }
  if (MG.next >= MG.pts.length){ MG.tr = null; MG.score++; $('#mgScore').textContent = MG.score; sfx('plate'); db.classList.add('done'); setTimeout(() => { db.classList.remove('done'); if (MG && MG.id === 'deco') decoNext(); }, 250); }
});
window.addEventListener('pointerup', () => { if (MG && MG.id === 'deco' && MG.tr){ MG.tr = null; const db = $('#mgDeco'); if (db){ const ink = $('.ink', db); if (ink) ink.setAttribute('points', ''); $$('.cp', db).forEach(c => c.classList.remove('hit')); } } });

/* =========================================================
   ミニゲーム追加：材料おぼえ・注文おぼえ
   ========================================================= */
MINI.push({id:'memory', name:'材料おぼえ', desc:'料理の材料を3秒で覚える（5問）', icon:() => ICON.star(), unit:'問', coin:20},
  {id:'order', name:'注文おぼえ', desc:'注文の順番を覚える（4回）', icon:() => ICON.people(), unit:'回', coin:25});
const _startMini4 = startMini;
startMini = function(id){
  if (id !== 'memory' && id !== 'order') return _startMini4(id);
  stopMini();
  const g = MINI.find(x => x.id === id);
  MG = {id, score:0, round:0};
  miniFrame(g, `<div class="mg-area quiz" id="mgMem"></div>`);
  show('mini');
  if (id === 'memory') memRound(); else ordRound();
};
const pickN = (arr, n) => { const a = arr.slice(), out = []; while (out.length < n && a.length) out.push(a.splice(Math.floor(Math.random() * a.length), 1)[0]); return out; };
function memRound(){
  const box = $('#mgMem'); if (!box || !MG) return;
  $('#mgTime').textContent = `${MG.round + 1}/5`;
  const ds = SHOPS.flatMap(s => s.dishes).filter(d => d.comps.length >= 2), d = ds[Math.floor(Math.random() * ds.length)];
  const comps = [...new Set(d.comps)], other = pickN(Object.keys(ING).filter(c => !comps.includes(c) && A[ING[c].raw]), 6 - comps.length);
  MG.d = d; MG.ans = comps; MG.sel = []; MG.lock = true;
  box.innerHTML = `<div class="qtext">「${esc(d.name)}」の材料を覚える</div><div class="qart show small"><i>${D[d.id]()}</i></div><div class="memrow">${comps.map(c => `<i>${A[ING[c].raw]()}</i>`).join('')}</div><div class="memcount">3</div>`;
  let n = 3; const t = setInterval(() => { n--; const c = $('.memcount', box); if (c) c.textContent = n || ''; if (n <= 0){ clearInterval(t); if (!MG || MG.id !== 'memory') return;
    MG.lock = false; const opts = pickN(comps.concat(other), 6);
    box.innerHTML = `<div class="qtext">「${esc(d.name)}」の材料は？（${comps.length}つ選ぶ）</div><div class="qart show small"><i>${D[d.id]()}</i></div><div class="qopts six">${opts.map(c => `<button class="btn withart" data-mem="${c}"><i>${A[ING[c].raw]()}</i>${esc(ING[c].name)}</button>`).join('')}</div>`; } }, 1000);
  MG.timer = t;
}
function ordRound(){
  const box = $('#mgMem'); if (!box || !MG) return;
  $('#mgTime').textContent = `${MG.round + 1}/4`;
  const ds = SHOPS.flatMap(s => s.dishes), len = 3 + Math.min(2, MG.round), pool = pickN(ds, 6), seq = pickN(pool, len);
  MG.seq = seq.map(d => d.id); MG.sel = []; MG.lock = true;
  let i = 0;
  const showOne = () => {
    if (!MG || MG.id !== 'order') return;
    if (i < seq.length){ box.innerHTML = `<div class="qtext">注文 ${i + 1}/${seq.length}</div><div class="qart show"><i>${D[seq[i].id]()}</i></div><div class="qtext sub">${esc(seq[i].name)}</div>`; sfx('arrive'); i++; MG.timer = setTimeout(showOne, 1100); return; }
    MG.lock = false;
    box.innerHTML = `<div class="qtext">来た順にタップ（${seq.length}つ）</div><div class="ordsel"></div><div class="qopts six">${pickN(pool, pool.length).map(d => `<button class="btn withart" data-ord="${d.id}"><i>${D[d.id]()}</i>${esc(d.name)}</button>`).join('')}</div>`;
  };
  showOne();
}
function mgNext(ok){
  sfx(ok ? 'serve' : 'nope'); if (ok){ MG.score++; $('#mgScore').textContent = MG.score; }
  toastMsg(ok ? '正解' : 'ざんねん'); MG.lock = true; MG.round++;
  const g = MINI.find(x => x.id === MG.id), max = MG.id === 'memory' ? 5 : 4;
  setTimeout(() => { if (!MG) return; if (MG.round >= max) return miniEnd(g, MG.score); MG.id === 'memory' ? memRound() : ordRound(); }, 1100);
}
$('#mini').addEventListener('click', e => {
  if (!MG || MG.lock) return;
  const m = e.target.closest('[data-mem]');
  if (m && MG.id === 'memory' && !m.classList.contains('sel')){
    m.classList.add('sel'); MG.sel.push(m.dataset.mem); sfx('tap');
    if (MG.sel.length >= MG.ans.length){
      const ok = MG.sel.every(c => MG.ans.includes(c));
      $$('[data-mem]', $('#mgMem')).forEach(b => { if (MG.ans.includes(b.dataset.mem)) b.classList.add('ok'); else if (b.classList.contains('sel')) b.classList.add('ng'); });
      mgNext(ok);
    }
  }
  const o = e.target.closest('[data-ord]');
  if (o && MG.id === 'order'){
    const want = MG.seq[MG.sel.length], ok = o.dataset.ord === want;
    MG.sel.push(o.dataset.ord); sfx('tap');
    const sel = $('.ordsel', $('#mgMem')); if (sel) sel.insertAdjacentHTML('beforeend', `<i class="${ok ? '' : 'ng'}">${D[o.dataset.ord]()}</i>`);
    if (!ok){ const r = $(`[data-ord="${want}"]`, $('#mgMem')); if (r) r.classList.add('ok'); return mgNext(false); }
    if (MG.sel.length >= MG.seq.length) mgNext(true);
  }
});
const _stopMini4 = stopMini;
stopMini = function(){ if (MG && MG.timer){ clearInterval(MG.timer); clearTimeout(MG.timer); } _stopMini4(); };

</script>
