/* =====================================================================
   なかよしキッチン — 落ち着いた色・細い線・やわらかい影
   ===================================================================== */
:root{
  --bg:#f4eee6; --bg2:#ebe3d8; --card:#fffdf9; --card2:#faf6f0;
  --ink:#2b2520; --sub:#8c8279; --line:#e7ded2; --line2:#d8ccbd;
  --wall:#f4eee6; --accent:#c8743a; --sign:#b86b32;
  --ok:#2e9a6b; --warn:#e0913a; --bad:#df5546;
  --r:20px; --r2:14px;
  --sh:0 1px 2px rgba(43,37,32,.05), 0 10px 28px rgba(43,37,32,.07);
  --sh2:0 1px 2px rgba(43,37,32,.06), 0 4px 12px rgba(43,37,32,.06);
  --safe-t:env(safe-area-inset-top); --safe-b:env(safe-area-inset-bottom); --safe-l:env(safe-area-inset-left); --safe-r:env(safe-area-inset-right);
  color-scheme:light;
}
body[data-theme=night]{
  --bg:#1c202b; --bg2:#252a37; --card:#2a2f3d; --card2:#232836; --ink:#f3eee7; --sub:#a39d96; --line:#3a4050; --line2:#4a5164; --wall:#1c202b;

  color-scheme:dark;
}

  font-family:"Zen Maru Gothic","M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans",system-ui,sans-serif;font-weight:500;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
body{background:radial-gradient(circle at 1px 1px, color-mix(in srgb,var(--ink) 7%,transparent) 1px, transparent 1.6px) 0 0/22px 22px, var(--bg)}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer;touch-action:manipulation}
input{font:inherit;color:inherit}
svg{display:block;width:100%;height:100%;overflow:visible}
[hidden]{display:none!important}
b,strong,h2,h3,h4{font-weight:700}

.deco{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.deco .lights{position:absolute;left:-2%;right:-2%;top:calc(var(--safe-t) + 2px);height:30px;opacity:.7}
.deco .lights i{position:absolute;top:8px;width:7px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c)}
.deco .lantern{position:absolute;top:calc(var(--safe-t) - 6px);width:20px;height:26px;border-radius:9px;background:#e8543f;opacity:.75;box-shadow:0 0 14px rgba(232,84,63,.45)}
.deco .flake{position:absolute;width:var(--s);height:var(--s);border-radius:50%;background:#fff;opacity:.7}

/* ---------- 画面 ---------- */
.screen{position:fixed;inset:0;z-index:1;display:none;flex-direction:column;
  padding:calc(var(--safe-t) + 14px) calc(var(--safe-r) + 16px) calc(var(--safe-b) + 14px) calc(var(--safe-l) + 16px)}
.screen.on{display:flex;animation:scr .3s ease}
@keyframes scr{from{opacity:0;transform:translateY(6px)}}
.topbar{display:flex;align-items:center;gap:12px;flex:none;min-height:52px;margin-bottom:10px}
.topbar h2{flex:1;font-size:clamp(19px,2.6vw,24px);letter-spacing:.04em}
.spacer{flex:1}

/* ---------- ボタン ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:50px;padding:0 20px;border-radius:var(--r2);
  background:var(--card);border:1px solid var(--line);box-shadow:var(--sh2);font-size:16px;font-weight:700;white-space:nowrap;position:relative;letter-spacing:.04em;
  transition:transform .1s, background .2s, box-shadow .2s}
.btn:active,.btn.press{transform:scale(.97)}
.btn .ic{width:24px;height:24px;flex:none}
.btn.big{min-height:62px;font-size:18px;border-radius:18px;padding:0 28px}
.btn.big .ic{width:30px;height:30px}
.btn.green{background:var(--ink);color:var(--card);border-color:transparent}
.btn.yellow{background:var(--bg2);border-color:transparent}
.btn.pink{background:color-mix(in srgb,var(--bad) 12%,var(--card));color:var(--bad);border-color:transparent}
.btn.round{width:50px;padding:0;border-radius:50%}
.btn.round .ic{width:22px;height:22px}
.btn.sm{min-height:40px;font-size:14px;padding:0 14px;border-radius:12px}
.btn.sm.round{width:40px;border-radius:50%}
.btn.sm .ic{width:20px;height:20px}
.btn:disabled{opacity:.4;pointer-events:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
body[data-theme=night] .mono svg{filter:invert(1) brightness(1.6)}

/* ---------- タイトル ---------- */
#title{align-items:center;justify-content:center;gap:clamp(12px,2.4vh,24px);text-align:center}
.logo{display:flex;flex-direction:column;align-items:center;gap:4px}
.logo .lg-hat{width:clamp(56px,7vw,76px);height:clamp(40px,5vw,54px)}
.logo .lg-w{font-size:clamp(38px,6.6vw,74px);font-weight:900;letter-spacing:.04em;line-height:1.05}
.logo .lg-w b{font-weight:900;color:var(--sign)}
.subtitle{font-size:clamp(12px,1.5vw,14px);color:var(--sub);letter-spacing:.3em;margin-top:-6px}
.weekcard{display:flex;align-items:center;gap:18px;padding:14px 18px;max-width:min(760px,100%);width:100%;text-align:left}
.weekcard .sign{flex:none;background:var(--sign);color:#fff;border-radius:12px;padding:10px 14px;font-size:clamp(16px,2.2vw,20px);font-weight:700;letter-spacing:.06em}
.weekcard .info{flex:1;min-width:0}
.weekcard .info small{display:block;font-size:12px;color:var(--sub);letter-spacing:.12em}
.weekcard .info b{display:block;font-size:clamp(15px,1.9vw,17px);margin:3px 0}
.weekcard .dishes{display:flex;gap:4px;flex:none}
.weekcard .dishes div{width:clamp(40px,5.6vw,60px);height:clamp(40px,5.6vw,60px)}
.title-me{display:flex;align-items:center;gap:14px;padding:8px 16px 8px 10px}
.title-me .av{width:62px;height:70px}
.title-btns{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.title-btns .btn{min-width:220px}
.title-foot{display:flex;gap:10px;align-items:center;justify-content:center}
.starcount{display:inline-flex;align-items:center;gap:6px;height:40px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:0 14px 0 8px;font-size:16px;font-weight:700;box-shadow:var(--sh2)}
.starcount .ic{width:22px;height:22px}
.howto{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:760px}
.howto span{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sub);letter-spacing:.06em}
.howto span i{width:22px;height:22px;display:block}
@media (max-height:600px){ .logo .lg-hat,.howto{display:none} .weekcard{padding:8px 14px} .title-me .av{width:44px;height:50px} .btn.big{min-height:52px} }

/* ---------- 合言葉 ---------- */
.pad-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
.pad-wrap .lbl{font-size:13px;color:var(--sub);letter-spacing:.16em}
.codebox{display:flex;gap:10px}
.codebox span{width:clamp(56px,11vw,76px);height:clamp(68px,13vw,90px);background:var(--card);border:1px solid var(--line);border-radius:16px;display:grid;place-items:center;font-size:clamp(34px,6vw,48px);font-weight:700;box-shadow:var(--sh2);font-variant-numeric:tabular-nums}
.codebox span.cur{border-color:var(--ink);box-shadow:0 0 0 3px color-mix(in srgb,var(--ink) 12%,transparent)}
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:min(340px,90vw)}
.numpad .btn{min-height:clamp(50px,8vh,64px);font-size:24px;padding:0;font-variant-numeric:tabular-nums}
.err{color:var(--bad);font-size:14px;min-height:22px;letter-spacing:.06em}
@media (orientation:landscape) and (max-height:600px){ .pad-wrap{flex-direction:row;gap:30px} }

/* ---------- 部屋 ---------- */
.lobby{flex:1;min-height:0;display:grid;grid-template-columns:minmax(250px,310px) 1fr;gap:16px}
.lb-left{display:flex;flex-direction:column;gap:12px;min-height:0}
.roomcode{padding:16px;text-align:center}
.roomcode small{font-size:12px;color:var(--sub);letter-spacing:.14em}
.roomcode .digits{font-size:clamp(40px,5.6vw,56px);font-weight:700;letter-spacing:.14em;line-height:1.2;font-variant-numeric:tabular-nums}
.roomcode .qr{width:140px;height:140px;margin:8px auto 6px;background:#fff;border-radius:12px;padding:8px;border:1px solid var(--line)}
.roomcode .qr img{width:100%;height:100%;image-rendering:pixelated}
.players{padding:14px;display:flex;flex-direction:column;gap:10px;overflow:auto;min-height:0}
.players h4,.lb-right > h4{font-size:12px;color:var(--sub);letter-spacing:.14em}
.pl{display:flex;align-items:center;gap:10px}
.pl .av{width:40px;height:45px;flex:none}
.pl b{flex:1;min-width:0;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl b small{color:var(--sub);font-size:12px;font-weight:500;margin-left:6px}
.pl .rs{display:flex;gap:3px}
.pl .rs i{width:26px;height:26px;display:block;padding:3px;border-radius:8px;background:var(--card2);border:1px solid var(--line)}
.lb-right{display:flex;flex-direction:column;gap:12px;min-height:0}
.roles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;flex:1;min-height:0}
.rolecard{display:flex;align-items:center;gap:16px;padding:16px 18px;text-align:left;border-radius:var(--r);background:var(--card);border:1px solid var(--line);box-shadow:var(--sh2);position:relative;transition:transform .1s, border-color .2s, background .2s}
.rolecard:active{transform:scale(.985)}
.rolecard .art{width:clamp(56px,7.5vw,74px);height:clamp(56px,7.5vw,74px);flex:none;padding:11px;border-radius:18px;background:color-mix(in srgb,var(--rc) 12%,var(--card))}
.rolecard b{display:block;font-size:clamp(17px,2vw,20px);letter-spacing:.04em}
.rolecard small{display:block;font-size:13px;color:var(--sub);margin-top:2px}
.rolecard .how{display:inline-block;margin-top:6px;font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--rc);background:color-mix(in srgb,var(--rc) 10%,var(--card));border-radius:999px;padding:2px 9px}
.rolecard .who{display:flex;gap:2px;margin-top:8px;min-height:26px}
.rolecard .who i{width:23px;height:26px;display:block}
.rolecard.on{border-color:var(--rc);background:color-mix(in srgb,var(--rc) 7%,var(--card));box-shadow:0 0 0 2px var(--rc), var(--sh2)}
.rolecard .chk{position:absolute;top:12px;right:12px;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center;transition:.2s}
.rolecard .chk svg{width:14px;height:14px;opacity:0}
.rolecard.on .chk{background:var(--rc);border-color:var(--rc)}
.rolecard.on .chk svg{opacity:1}
.rolecard:disabled{opacity:1}
.lb-hint{font-size:13px;color:var(--sub);line-height:1.7}
.lb-start{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.stagepick{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:5px;box-shadow:var(--sh2)}
.stagepick b{min-width:104px;text-align:center;font-size:16px;font-variant-numeric:tabular-nums}
.waitmsg{flex:1;font-size:15px;color:var(--sub);text-align:center;letter-spacing:.08em}
@media (orientation:portrait), (max-width:760px){
  .lobby{grid-template-columns:1fr;grid-template-rows:auto auto 1fr;overflow:auto}
  .lb-left{display:grid;grid-template-columns:auto 1fr}
  .roomcode .qr{width:104px;height:104px}
  .roles{grid-template-columns:1fr 1fr;flex:none}
  .lb-right{min-height:auto}
  .rolecard{min-height:96px}
}
@media (max-width:520px){ .roles{grid-template-columns:1fr} .rolecard{padding:12px 14px} .lb-left{grid-template-columns:1fr} .roomcode{display:flex;align-items:center;justify-content:center;gap:16px;text-align:left} .roomcode .qr{margin:0;width:90px;height:90px} .rc-h{display:none} }

/* ---------- 着せ替え ---------- */
.dress{flex:1;min-height:0;display:grid;grid-template-columns:minmax(220px,290px) 1fr;gap:16px}
.dress .preview{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:18px}
.dress .preview .av{width:min(180px,40vw);height:min(202px,45vw)}
.dress .opts{overflow:auto;padding:16px 18px;display:flex;flex-direction:column;gap:18px}
.dress h4{font-size:12px;color:var(--sub);letter-spacing:.14em;margin-bottom:8px}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatches button{width:40px;height:40px;border-radius:50%;border:2px solid var(--card);box-shadow:0 0 0 1px var(--line2)}
.swatches button.on{box-shadow:0 0 0 2px var(--ink)}
.hats{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px}
.hat{border:1px solid var(--line);border-radius:16px;background:var(--card);padding:6px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;position:relative}
.hat .av{width:56px;height:63px}
.hat.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.hat.lock{opacity:.5}
.hat.lock .av{filter:grayscale(1)}
.hat .need{position:absolute;top:6px;right:6px;display:flex;align-items:center;gap:2px;font-size:11px;font-weight:700}
.hat .need i{width:13px;height:13px;display:block}
.nameinput{width:100%;min-height:48px;border:1px solid var(--line);border-radius:14px;padding:6px 14px;font-size:18px;font-weight:700;background:var(--card2);outline:none;text-align:center}
.nameinput:focus{border-color:var(--ink)}
@media (orientation:portrait), (max-width:760px){ .dress{grid-template-columns:1fr;grid-template-rows:auto 1fr} .dress .preview{flex-direction:row;padding:10px 14px} .dress .preview .av{width:84px;height:95px} }

/* ---------- プレイ ---------- */
#play{padding:calc(var(--safe-t) + 8px) calc(var(--safe-r) + 10px) calc(var(--safe-b) + 8px) calc(var(--safe-l) + 10px);gap:8px}
.hud{display:flex;align-items:center;gap:8px;flex:none;min-height:40px}
.hud .sign{background:var(--sign);color:#fff;border-radius:10px;padding:5px 12px;font-size:clamp(13px,1.6vw,15px);font-weight:700;white-space:nowrap;letter-spacing:.04em}
.hud .prog{flex:1;display:flex;align-items:center;gap:5px;min-width:0;overflow:hidden;padding:0 6px}
.hud .prog i{width:clamp(9px,1.2vw,12px);height:clamp(9px,1.2vw,12px);border-radius:50%;background:var(--line2);flex:none;transition:.3s}
.hud .prog i.ok{background:var(--ok)}
.hud .prog i.ng{background:color-mix(in srgb,var(--sub) 45%,transparent)}
.hud .prog i.now{background:var(--warn);box-shadow:0 0 0 3px color-mix(in srgb,var(--warn) 22%,transparent)}
.hud .coins{display:flex;align-items:center;gap:5px;height:34px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:0 12px 0 5px;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;box-shadow:var(--sh2)}
.hud .coins .ic{width:22px;height:22px}
.hud .mates{display:flex;gap:1px}
.hud .mates i{width:26px;height:29px;display:block}

/* お客 */
.orders{flex:none;display:flex;gap:8px;min-height:var(--oh,124px);height:var(--oh,124px)}
.order{flex:0 1 calc((100% - 24px) / 4);max-width:300px;min-width:0;position:relative;display:flex;gap:8px;align-items:center;padding:8px 10px 12px;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh2);overflow:hidden;animation:oin .45s cubic-bezier(.2,1.2,.4,1);transition:border-color .15s, box-shadow .15s, transform .15s}
@keyframes oin{from{transform:translateY(-16px);opacity:0}}
.order.happy{animation:ohappy 1.8s ease forwards;border-color:var(--ok)}
.order.left{animation:oleft 1.8s ease forwards}
.order.dz{border-color:var(--ok);box-shadow:0 0 0 2px var(--ok)}
.order.dz.hot{transform:scale(1.04);background:color-mix(in srgb,var(--ok) 10%,var(--card))}
@keyframes ohappy{0%{transform:none}15%{transform:translateY(-4px)}80%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
@keyframes oleft{70%{opacity:1}100%{opacity:0}}
.order .face{width:var(--fs,52px);height:var(--fs,52px);flex:none}
.order .body{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px}
.order .dish{width:var(--ds,64px);height:var(--ds,64px)}
.order .comps{display:flex;gap:3px;justify-content:center;flex:none}
.order .comps i{width:var(--cs,22px);height:var(--cs,22px);display:block;position:relative;opacity:.35;filter:grayscale(.8)}
.order .comps i.ok{opacity:1;filter:none}
.order .comps i.ok::after{content:"";position:absolute;right:-2px;bottom:-2px;width:9px;height:9px;border-radius:50%;background:var(--ok);border:1.5px solid var(--card)}
.order .pat{position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--bg2)}
.order .pat b{display:block;height:100%;background:var(--ok);transition:width .5s linear}
.order .pat b.low{background:var(--bad)}
.order .nm{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.order .coin{position:absolute;top:6px;right:8px;display:flex;align-items:center;gap:3px;font-size:14px;font-weight:700;color:var(--ok);animation:coinup 1.6s ease forwards}
.order .coin i{width:18px;height:18px;display:block}
@keyframes coinup{0%{transform:translateY(8px);opacity:0}20%{transform:none;opacity:1}100%{transform:translateY(-6px);opacity:0}}
.order .hearts{position:absolute;inset:0;pointer-events:none}
.order .hearts i{position:absolute;width:18px;height:18px;left:var(--x);top:55%;animation:hup 1.2s ease-out var(--d) forwards;opacity:0}
@keyframes hup{0%{transform:translateY(0) scale(.5);opacity:0}20%{opacity:1}100%{transform:translateY(-56px) scale(1);opacity:0}}
.orders .empty{flex:1;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:14px;letter-spacing:.12em;border:1.5px dashed var(--line2);border-radius:18px}

/* 係のパネル */
.stations{flex:1;min-height:0;display:grid;gap:10px;grid-template-columns:repeat(var(--cols,1),minmax(0,1fr));grid-template-rows:repeat(var(--rows,1),minmax(0,1fr))}
.panel{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:var(--sh);background:var(--card)}
.panel .ph{display:flex;align-items:center;gap:8px;padding:9px 14px 7px;flex:none;font-size:clamp(14px,1.6vw,16px);font-weight:700;letter-spacing:.04em}
.panel .ph::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--rc);flex:none}
.panel .ph i{display:none}
.panel .ph .tip{margin-left:auto;font-size:11px;font-weight:700;color:var(--rc);background:color-mix(in srgb,var(--rc) 10%,var(--card));border-radius:999px;padding:2px 10px;white-space:nowrap;letter-spacing:.08em}
.panel .pb{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;padding:4px 10px 10px;gap:8px;container-type:size}

/* 待ち列 */
.queue{flex:none;display:flex;gap:6px;align-items:center;min-height:56px;padding:5px 10px;background:var(--card2);border:1px solid var(--line);border-radius:14px}
.queue .ql{font-size:11px;color:var(--sub);white-space:nowrap;margin-right:4px;letter-spacing:.12em}
.queue .qi{width:clamp(42px,11cqmin,60px);height:clamp(42px,11cqmin,60px);flex:none;position:relative;animation:pin .3s cubic-bezier(.2,1.3,.4,1);border-radius:12px;touch-action:none}
.queue .qi.grab{background:var(--card);border:1px solid var(--line);box-shadow:var(--sh2);padding:4px;cursor:grab}
.queue .none{font-size:12px;color:var(--sub)}
.x{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:var(--ink);color:var(--card);display:grid;place-items:center;font-size:11px;line-height:1;padding:0;z-index:3}
@keyframes pin{from{transform:scale(.4);opacity:0}}

/* 材料：箱からつかんで、下の「送る」にドラッグ */
.crates{flex:1;min-height:0;display:grid;gap:clamp(6px,1.8cqmin,10px);grid-template-columns:repeat(var(--cc,4),minmax(0,1fr));grid-auto-rows:minmax(0,1fr)}
.crate{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 4px 8px;border-radius:16px;background:var(--card2);border:1px solid var(--line);transition:transform .08s, box-shadow .2s, border-color .2s;touch-action:none;cursor:grab}
.crate:active,.crate.press{transform:scale(.95)}
.crate .art{flex:1;min-height:0;width:80%;max-width:120px;position:relative;margin:2px 0 4px;pointer-events:none}
.crate .lb{font-size:clamp(11px,2.4cqmin,13px);color:var(--sub);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.crate .need{position:absolute;top:7px;right:7px;min-width:22px;height:22px;border-radius:11px;background:var(--rc);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700;padding:0 6px}
.crate.want{border-color:var(--rc);box-shadow:0 0 0 1px var(--rc);background:color-mix(in srgb,var(--rc) 6%,var(--card))}
.crate.full{opacity:.45}
.chute{flex:none;height:clamp(54px,16cqh,80px);display:flex;align-items:center;justify-content:center;gap:10px;border-radius:16px;border:1.5px dashed var(--line2);color:var(--sub);font-size:13px;font-weight:700;letter-spacing:.14em;
  background:repeating-linear-gradient(90deg,var(--card2) 0 22px,color-mix(in srgb,var(--line) 60%,var(--card2)) 22px 24px);background-size:24px 100%;transition:.15s}
.chute svg{width:22px;height:22px}
.chute.dz{border-color:var(--rc);color:var(--rc);animation:belt .6s linear infinite}
.chute.dz.hot{background-color:color-mix(in srgb,var(--rc) 10%,var(--card));border-style:solid;transform:scale(1.02)}
@keyframes belt{to{background-position:24px 0}}

/* ドラッグ中のもの */
.ghost{position:fixed;z-index:80;pointer-events:none;width:72px;height:72px;margin:-36px 0 0 -36px;filter:drop-shadow(0 10px 16px rgba(0,0,0,.28));transform:scale(1.1) rotate(-4deg);transition:transform .1s}
.ghost.big{width:110px;height:110px;margin:-55px 0 0 -55px}
.fly{position:fixed;z-index:70;pointer-events:none;width:56px;height:56px;animation:fly .45s cubic-bezier(.3,.1,.5,1) forwards}
@keyframes fly{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.4);opacity:0}}
.back{position:fixed;z-index:70;pointer-events:none;width:72px;height:72px;margin:-36px 0 0 -36px;transition:left .25s ease, top .25s ease, opacity .25s}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}

/* 切る：連打 */
.boards{flex:1;min-height:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.board{position:relative;border-radius:18px;background:linear-gradient(160deg,#f0dcbd,#e3c398);box-shadow:inset 0 -3px 0 rgba(0,0,0,.08);display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none}
body[data-theme=night] .board{background:linear-gradient(160deg,#cbb08b,#b8976d)}
.board::after{content:"";position:absolute;right:12px;top:50%;width:9px;height:9px;border-radius:50%;background:rgba(120,80,40,.25);transform:translateY(-50%)}
.board .it{width:min(58%,58cqh);aspect-ratio:1;position:relative;z-index:1}
.board .it.hit{animation:squish .14s}
@keyframes squish{50%{transform:scale(1.07,.9)}}
.board .knife{position:absolute;z-index:2;width:38%;max-width:120px;aspect-ratio:1;right:6%;top:5%;transform-origin:85% 85%;pointer-events:none}
.board .knife.down{animation:chopk .14s}
@keyframes chopk{50%{transform:rotate(-26deg) translate(-12%,10%)}}
.board .bar{position:absolute;bottom:12px;left:14%;right:14%;height:7px;border-radius:4px;background:rgba(43,37,32,.14);overflow:hidden;z-index:2}
.board .bar b{display:block;height:100%;width:0;background:var(--rc);border-radius:4px;transition:width .1s}
.board .tapme{position:absolute;top:10px;left:12px;z-index:2;font-size:11px;letter-spacing:.16em;color:rgba(43,37,32,.6);font-weight:700}
.board .combo{position:absolute;top:10px;right:14px;z-index:3;font-size:clamp(14px,4cqmin,22px);font-weight:900;color:var(--rc);letter-spacing:.04em;opacity:0}
.board .combo.on{animation:combo .5s ease-out}
@keyframes combo{0%{opacity:0;transform:scale(.6)}30%{opacity:1;transform:scale(1.15)}100%{opacity:0;transform:translateY(-10px)}}
.board .emp{color:rgba(43,37,32,.45);font-size:13px;letter-spacing:.12em}
.board .crumbs{position:absolute;inset:0;pointer-events:none}
.board .crumbs i{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--c);left:50%;top:50%;animation:crumb .5s ease-out forwards}
@keyframes crumb{to{transform:translate(var(--dx),var(--dy));opacity:0}}

/* 焼く：ドラッグで入れて、長押しで取り出す */
.cooker{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:10px;border-radius:18px;background:#3b3f47}
.cooker.oven{background:linear-gradient(180deg,#4a4f59,#383c44)}
.cooker.stove{background:#d9dde3}
body[data-theme=night] .cooker.stove{background:#3b4150}
.cooker.grill{background:#33363c}
.slot{position:relative;border-radius:14px;display:flex;align-items:center;justify-content:center;overflow:visible;touch-action:none;transition:box-shadow .15s}
.slot.dz{box-shadow:0 0 0 3px var(--rc)}
.slot.dz.hot{box-shadow:0 0 0 4px #fff, 0 0 0 7px var(--rc)}
.cooker.oven .slot{background:#231c18;box-shadow:inset 0 0 0 4px #5b616c}
.cooker.oven .slot.on{background:radial-gradient(90% 80% at 50% 45%,#e8833d,#8f3c1a)}
.cooker.oven .slot.dz{box-shadow:inset 0 0 0 4px #5b616c, 0 0 0 3px var(--rc)}
.cooker.stove .slot{background:radial-gradient(circle at 50% 50%,#2b2e35 0 44%,#9aa2ae 45% 49%,transparent 50%)}
.cooker.stove .slot.on{background:radial-gradient(circle at 50% 50%,#2b2e35 0 44%,#f07a3c 45% 51%,transparent 52%)}
.cooker.grill .slot{background:repeating-linear-gradient(90deg,#2a2d33 0 9px,#222429 9px 12px)}
.cooker.grill .slot.on{box-shadow:inset 0 -14px 24px rgba(240,122,60,.4)}
.slot .it{width:min(66%,54cqh);aspect-ratio:1;position:relative;z-index:1;transition:filter .4s}
.slot .it.cooking{animation:sizzle .5s ease-in-out infinite}
.slot.burnt .it{filter:brightness(.35) saturate(.4)}
@keyframes sizzle{50%{transform:translateY(-2px)}}
.slot .ring{position:absolute;inset:7%;z-index:2;pointer-events:none}
.slot .ring circle{fill:none;stroke-width:5;stroke-linecap:round}
.slot .done{position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:3;background:var(--ok);color:#fff;border-radius:999px;padding:3px 12px;font-size:11px;font-weight:700;letter-spacing:.12em;white-space:nowrap}
.slot.warn .done{background:var(--warn);animation:blink .5s steps(2) infinite}
.slot.burnt .done{background:#3b3f47}
@keyframes blink{50%{opacity:.5}}
.slot.ready .it{animation:ready 1.1s ease-in-out infinite}
@keyframes ready{50%{transform:translateY(-4px)}}
.slot .hold{position:absolute;inset:-4px;z-index:4;pointer-events:none;opacity:0}
.slot .hold circle{fill:none;stroke:#fff;stroke-width:6;stroke-linecap:round}
.slot.holding .hold{opacity:1}
.slot .emp{color:rgba(255,255,255,.35);font-size:12px;letter-spacing:.14em}
.cooker.stove .slot .emp{color:#9aa2ae}
.slot.taken{opacity:.5}
.slot.taken .done{display:none}
.steam{position:absolute;left:50%;top:14%;width:12px;height:12px;border-radius:50%;background:#fff;opacity:0;animation:steam 1.6s ease-out infinite;z-index:3;pointer-events:none}
.slot.burnt .steam{background:#555}
@keyframes steam{0%{transform:translate(-50%,10px) scale(.6);opacity:0}30%{opacity:.5}100%{transform:translate(-50%,-26px) scale(1.4);opacity:0}}

/* 渡す：お皿にドラッグ → できた料理をお客にドラッグ */
.tray{flex:none;display:flex;gap:8px;align-items:center;min-height:70px;padding:6px 10px;background:var(--card2);border:1px solid var(--line);border-radius:14px;overflow-x:auto;scrollbar-width:none}
.tray::-webkit-scrollbar{display:none}
.tray .ql{font-size:11px;color:var(--sub);white-space:nowrap;letter-spacing:.12em;margin-right:4px}
.tray .ti{width:clamp(48px,12cqmin,66px);height:clamp(48px,12cqmin,66px);flex:none;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;position:relative;box-shadow:var(--sh2);animation:pin .3s cubic-bezier(.2,1.3,.4,1);touch-action:none;cursor:grab}
.tray .ti.use{border-color:var(--rc);box-shadow:0 0 0 1px var(--rc)}
.tray .ti.extra{opacity:.55}
.plates{flex:1;min-height:0;display:grid;grid-template-columns:repeat(var(--pc,2),minmax(0,1fr));gap:8px;grid-auto-rows:minmax(0,1fr)}
.platecard{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:8px;border:1px solid var(--line);border-radius:16px;background:var(--card2);min-height:0;overflow:hidden;transition:box-shadow .15s, border-color .15s, transform .15s}
.platecard.dz{border-color:var(--rc);box-shadow:0 0 0 2px var(--rc)}
.platecard.dz.hot{transform:scale(1.03);background:color-mix(in srgb,var(--rc) 10%,var(--card))}
.platecard.done{background:color-mix(in srgb,var(--ok) 8%,var(--card));border-color:var(--ok);touch-action:none;cursor:grab}
.platecard .top{display:flex;align-items:center;gap:6px;width:100%}
.platecard .top .face{width:28px;height:28px;flex:none}
.platecard .top b{font-size:clamp(12px,2.8cqmin,14px);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.platecard .slots{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;width:100%;pointer-events:none}
.platecard .slots i{width:clamp(40px,14cqmin,92px);height:clamp(40px,14cqmin,92px);display:block;border-radius:50%;background:var(--card);border:1.5px dashed var(--line2);padding:4px}
.platecard .slots i.ok{border:1.5px solid var(--ok);animation:pin .3s}
.platecard .slots i:not(.ok) svg{opacity:.28;filter:grayscale(1)}
.platecard .dishbig{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;pointer-events:none}
.platecard .dishbig div{height:100%;max-height:120px;aspect-ratio:1;animation:pin .4s}
.platecard .go{font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--ok);display:flex;align-items:center;gap:4px;pointer-events:none}
.platecard .go svg{width:14px;height:14px}
.plates .none{grid-column:1/-1;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:14px;letter-spacing:.12em}
.dragging .platecard.src{opacity:.35}

@container (aspect-ratio < .8){ .cooker{grid-template-columns:1fr;grid-template-rows:repeat(3,minmax(0,1fr))} .boards{grid-template-columns:1fr;grid-template-rows:repeat(2,minmax(0,1fr))} .board .it{width:min(46%,32cqh)} .slot .it{width:min(38%,22cqh)} }
@container (max-height:230px){ .crate .lb{display:none} .crate .art{width:90%} .queue{min-height:44px} .queue .qi{width:38px;height:38px} .tray{min-height:54px} .tray .ti{width:44px;height:44px} .board .tapme{display:none} .chute{height:42px} }

#play.compact .panel .ph .tip{display:none}
#play.compact .hud .sign{font-size:12px;padding:4px 8px}
#play.compact .hud .mates{display:none}
#play.compact .hud .coins{font-size:13px;height:30px;padding:0 9px 0 4px}
#play.compact .hud .coins .ic{width:18px;height:18px}
#play.compact .hud{min-height:34px}
#play.compact .order{padding:5px 5px 8px;border-radius:14px;gap:3px;flex-direction:column}
#play.compact .order .nm{display:none}
#play.compact .order .face{position:absolute;left:3px;top:3px;width:24px;height:24px}

.tabs{flex:none;display:flex;gap:4px;padding:4px;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh)}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:14px;font-size:12px;font-weight:700;color:var(--sub);position:relative;letter-spacing:.06em}
.tabs button i{width:26px;height:26px;display:block;opacity:.6}
.tabs button.on{background:color-mix(in srgb,var(--rc) 12%,var(--card));color:var(--ink)}
.tabs button.on i{opacity:1}
.tabs button .bd{position:absolute;top:3px;right:calc(50% - 26px);min-width:18px;height:18px;border-radius:9px;background:var(--rc);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 5px}
@media (orientation:landscape) and (max-height:600px){ .tabs button{flex-direction:row;justify-content:center;gap:6px;padding:5px} .tabs button i{width:22px;height:22px} .tabs button .bd{position:static} }

/* ---------- 中央カード ---------- */
.overlay{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:20px;background:rgba(28,24,20,.32);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:fade .25s}
@keyframes fade{from{opacity:0}}
.ovcard{width:min(600px,100%);max-height:100%;overflow:auto;padding:26px 26px 22px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;animation:popin .4s cubic-bezier(.2,1.2,.4,1)}
@keyframes popin{from{transform:translateY(12px) scale(.97);opacity:0}}
.ovcard h3{font-size:clamp(22px,3.4vw,30px);letter-spacing:.06em}
.ovcard .sign{background:var(--sign);color:#fff;border-radius:10px;padding:5px 14px;font-size:14px;font-weight:700;letter-spacing:.08em}
.ovcard .lead{font-size:13px;color:var(--sub);letter-spacing:.08em;line-height:1.7}
.newdish{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;background:var(--card2);border:1px solid var(--line);border-radius:18px;padding:12px;width:100%}
.newdish .step{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--sub)}
.newdish .step .a{width:clamp(40px,7vw,54px);height:clamp(40px,7vw,54px)}
.newdish .step .r{width:22px;height:22px}
.newdish .arrow{color:var(--line2);font-size:16px}
.newdish .plus{font-size:20px;color:var(--sub);padding:0 2px}
.newdish .eq .a{width:clamp(64px,11vw,86px);height:clamp(64px,11vw,86px)}
.newdish .nm{width:100%;font-size:13px;font-weight:700;color:var(--ink);margin-bottom:2px;letter-spacing:.08em}
.recipe-row{display:flex;align-items:center;gap:4px}
.countdown{font-size:clamp(34px,6vw,52px);font-weight:900;letter-spacing:.08em;min-height:1.2em;animation:popin .35s}
.stars{display:flex;gap:10px}
.stars i{width:clamp(52px,9vw,76px);height:clamp(52px,9vw,76px);display:block;opacity:0;transform:scale(.4)}
.stars i.in{animation:starin .45s cubic-bezier(.2,1.5,.4,1) forwards}
@keyframes starin{to{opacity:1;transform:none}}
.res-row{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;font-size:15px}
.res-row .pill{display:flex;align-items:center;gap:6px;height:38px;background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:0 14px 0 8px;font-weight:700;font-variant-numeric:tabular-nums}
.res-row .pill i{width:22px;height:22px;display:block}
.unlock{display:flex;align-items:center;gap:12px;background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:8px 16px;animation:pin .5s .9s both}
.unlock .av{width:48px;height:54px}
.unlock small{color:var(--sub);font-size:12px;letter-spacing:.1em}
.ov-btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

#toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 96px);z-index:90;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;transition:.25s;
  background:var(--ink);color:var(--card);border-radius:14px;padding:11px 20px;font-size:15px;font-weight:700;box-shadow:var(--sh);max-width:calc(100% - 32px);text-align:center;letter-spacing:.04em}
#toast.on{opacity:1;transform:translateX(-50%)}
.dialog .ovcard{width:min(420px,100%)}
.loading{display:flex;flex-direction:column;align-items:center;gap:14px;font-size:15px;color:var(--sub);letter-spacing:.1em}
.loading .pan{width:70px;height:70px;animation:bob 1s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}

/* ---------- iPhone 向け（小さい画面） ---------- */
.menus{display:flex;flex-direction:column;gap:10px;width:100%}
body:has(#ov .overlay) #toast{bottom:auto;top:calc(var(--safe-t) + 10px)}
@media (max-width:520px){ .roomcode .av{width:64px!important;height:72px!important;margin:0!important} }
#title{justify-content:flex-start;overflow-y:auto}
#title > :first-child{margin-top:auto}
#title > :last-child{margin-bottom:auto}

.logo .lg-w{font-size:clamp(30px,min(6.6vw,11vh),74px)}
.weekcard{flex-wrap:wrap}
@media (max-width:560px){ .weekcard{gap:10px 14px} .weekcard .dishes{width:100%;justify-content:center} .weekcard .dishes div{width:44px;height:44px} .title-btns .btn{min-width:0;flex:1 1 140px} .title-btns{width:100%} }
@media (max-height:600px){ #title{gap:10px} .subtitle{margin-top:-2px} .weekcard .dishes div{width:40px;height:40px} }

@media (orientation:portrait), (max-width:760px){ .lb-left{min-height:auto;flex:none} .lobby > *{min-height:auto} }
@media (orientation:landscape) and (max-height:600px){
  .topbar{min-height:44px;margin-bottom:6px} .btn.round{width:44px;min-height:44px}
  .lobby{grid-template-columns:200px 1fr;grid-template-rows:none;overflow:hidden;gap:12px}
  .lb-left{display:flex;min-height:0;overflow:auto}
  .lb-left .roomcode{padding:10px} .lb-left .roomcode .av{width:70px!important;height:79px!important;margin:4px auto!important}
  .roomcode .qr{width:84px;height:84px;margin:4px auto} .roomcode .digits{font-size:34px} .rc-h{display:none}

  .rolecard{min-height:0;padding:8px 10px;gap:10px} .rolecard .art{width:44px;height:44px;padding:7px;border-radius:12px}
  .rolecard b{font-size:15px} .rolecard small{font-size:11px} .rolecard .how{margin-top:3px} .rolecard .who{margin-top:3px;min-height:0} .rolecard .chk{top:8px;right:8px;width:22px;height:22px}
  .lb-hint{font-size:12px;line-height:1.5} .btn.big{min-height:48px}
  .ovcard{padding:14px 18px;gap:8px;width:min(860px,100%)} .ovcard h3{font-size:22px}
  .menus{display:flex;flex-direction:row;flex-wrap:wrap;gap:8px;justify-content:center;width:100%} .menus .newdish{flex:1 1 240px;width:auto;padding:6px}
  .newdish .step .a{width:34px;height:34px} .newdish .eq .a{width:52px;height:52px}
  .stars i{width:46px;height:46px} .countdown{font-size:30px}
  #toast{bottom:auto;top:calc(var(--safe-t) + 8px)}
}
/* 横向き iPhone：タブを左にたてに並べて、たての広さを確保 */
#play.side{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr);gap:6px 8px}

@container (aspect-ratio > 2.6){ .pb-z{flex-direction:row} }

/* 急ぎのお客・ラッシュ・連続 */

.banner{position:fixed;left:50%;top:42%;z-index:95;pointer-events:none;transform:translate(-50%,-50%);background:var(--ink);color:var(--card);font-weight:900;font-size:clamp(28px,6vw,48px);letter-spacing:.3em;padding:10px 34px 10px 46px;border-radius:18px;box-shadow:var(--sh);animation:ban 1.7s cubic-bezier(.2,1.2,.4,1) forwards}
.banner.small{top:30%;font-size:clamp(16px,3vw,22px);letter-spacing:.14em;padding:6px 18px;background:var(--ok);border-radius:999px}
@keyframes ban{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}15%{opacity:1;transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%)}}

.rec{font-style:normal;margin-left:6px;background:var(--bad);color:#fff;border-radius:999px;padding:1px 8px;font-size:11px;letter-spacing:.08em;animation:pin .5s 1.2s both}

.spbest{font-size:10px;color:var(--sub);font-weight:500;letter-spacing:.04em;white-space:nowrap}

/* ひとこと */
#stampMenu{position:fixed;z-index:96;display:grid;grid-template-columns:repeat(2,auto);gap:6px;padding:8px;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);animation:popin .2s}

#stampBox{position:fixed;left:calc(var(--safe-l) + 12px);bottom:calc(var(--safe-b) + 80px);z-index:94;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.stamp{display:flex;align-items:center;gap:8px;padding:5px 14px 5px 6px;background:var(--card);border:1.5px solid var(--sc);border-radius:999px;box-shadow:var(--sh);font-weight:700;font-size:15px;animation:stin 2.6s ease forwards}
.stamp i{width:30px;height:34px;display:block}
.stamp span{display:flex;flex-direction:column;line-height:1.15;color:var(--sc)}
body[data-theme=night] .stamp span{color:color-mix(in srgb,var(--sc) 50%,#fff)}
.stamp small{font-size:10px;color:var(--sub);font-weight:500}
@keyframes stin{0%{opacity:0;transform:translateX(-20px)}10%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}

/* はじめてのガイド */
#guide{position:fixed;z-index:85;pointer-events:none;width:0;height:0}
#guide .ring{position:absolute;left:-26px;top:-26px;width:52px;height:52px;border-radius:50%;border:3px solid var(--ink);opacity:.55;animation:gring 1.2s ease-out infinite}
#guide span{position:absolute;left:0;top:34px;transform:translateX(-50%);white-space:nowrap;background:var(--ink);color:var(--card);font-size:13px;font-weight:700;letter-spacing:.08em;padding:5px 12px;border-radius:999px;box-shadow:var(--sh2)}
#guide.up span{top:auto;bottom:34px}
@keyframes gring{0%{transform:scale(.5);opacity:.7}100%{transform:scale(1.4);opacity:0}}

.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;gap:2px;box-shadow:var(--sh2)}
.seg button{min-height:38px;padding:0 12px;border-radius:10px;font-size:14px;font-weight:700;color:var(--sub);letter-spacing:.04em}
.seg button.on{background:var(--ink);color:var(--card)}
.btn.sm.off{color:var(--sub)}

.stats{width:100%;display:flex;flex-direction:column;gap:6px}
.srow{display:flex;align-items:center;gap:10px;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:5px 12px 5px 6px;text-align:left}
.srow i{width:30px;height:34px;display:block;flex:none}
.srow b{font-size:14px;white-space:nowrap}
.srow em{font-style:normal;font-size:10px;font-weight:700;color:#fff;background:var(--warn);border-radius:999px;padding:1px 8px;letter-spacing:.08em}
.srow span{margin-left:auto;font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow.mvp{border-color:var(--warn)}
@media (orientation:landscape) and (max-height:600px){ .stats{display:grid;grid-template-columns:1fr 1fr} }

/* 今週のチャレンジ */
.weekcard .chal{order:5;width:100%;display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);padding-top:8px;margin-top:2px}
.weekcard .chal small{font-size:11px;color:var(--sub);letter-spacing:.12em;white-space:nowrap}
.weekcard .chal b{flex:1;min-width:0;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.weekcard .chal span{font-size:12px;font-weight:700;color:var(--warn);border:1px solid var(--warn);border-radius:999px;padding:1px 10px;white-space:nowrap}
.weekcard .chal.done span{background:var(--ok);border-color:var(--ok);color:#fff}
.chalok{display:flex;align-items:center;gap:10px;background:color-mix(in srgb,var(--warn) 10%,var(--card));border:1px solid var(--warn);border-radius:14px;padding:8px 14px;animation:pin .5s 1.4s both;text-align:left}
.chalok small{display:block;font-size:11px;color:var(--warn);font-weight:700;letter-spacing:.1em}
.chalok b{font-size:14px}
.chalok span{margin-left:auto;font-weight:900;color:var(--warn)}
@media (max-height:600px){ .weekcard .chal{padding-top:4px} }
.chalok{flex-wrap:wrap;row-gap:0} .chalok small{width:100%}
.weekcard .chal b{white-space:normal;line-height:1.35}

#lag{position:fixed;left:50%;top:calc(var(--safe-t) + 54px);transform:translateX(-50%);z-index:93;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 16px;font-size:13px;font-weight:700;color:var(--sub);letter-spacing:.1em;box-shadow:var(--sh);pointer-events:none}
#lag i{width:12px;height:12px;border-radius:50%;border:2px solid var(--line2);border-top-color:var(--ink);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* 遊び方 */
.helpov .ovcard{width:min(720px,100%)}
.help{width:100%;display:flex;flex-direction:column;gap:8px}
.hrow{display:flex;align-items:center;gap:12px;text-align:left;background:var(--card2);border:1px solid var(--line);border-left:4px solid var(--rc);border-radius:14px;padding:8px 12px}
.hrow .hr{width:40px;height:40px;flex:none;padding:6px;border-radius:12px;background:color-mix(in srgb,var(--rc) 12%,var(--card))}
.hrow div{flex:1;min-width:0}
.hrow b{display:flex;align-items:center;gap:8px;font-size:15px}
.hrow b span{font-size:10px;color:var(--rc);background:color-mix(in srgb,var(--rc) 10%,var(--card));border-radius:999px;padding:1px 8px;letter-spacing:.08em}
.hrow small{display:block;font-size:12px;color:var(--sub);line-height:1.55;margin-top:2px}
.hrow .ha{width:46px;height:46px;flex:none}
.tips{width:100%;display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px}
.tips div{text-align:left;border:1px solid var(--line);border-radius:12px;padding:6px 10px}
.tips b{font-size:13px;margin-right:6px}
.tips small{font-size:11px;color:var(--sub)}
@media (orientation:landscape) and (max-height:600px){ .help{display:grid;grid-template-columns:1fr 1fr} .hrow .ha{display:none} }

</style>
</head>

const EPOCH = new Date(2026, 10, 23).getTime();   // 2026年11月23日（月）
const WEEK = 7 * 864e5;
const mod = (a, n) => ((a % n) + n) % n;
function weekInfo(t = Date.now()){
  const d = new Date(t); d.setHours(0, 0, 0, 0);
  const w = Math.floor((d.getTime() - EPOCH) / WEEK + 1e-9);
  const shop = SHOPS[mod(w, SHOPS.length)], theme = THEMES[mod(Math.floor(w / SHOPS.length), THEMES.length)];
  const endsAt = EPOCH + (w + 1) * WEEK;
  const daysLeft = Math.max(1, Math.ceil((endsAt - t) / 864e5));
  return {w, shop, theme, daysLeft, next:SHOPS[mod(w + 1, SHOPS.length)]};
}

/* ---------- ステージ（番号から自動で作ります） ---------- */
function hashStr(s){ let h = 2166136261; for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function rngOf(seed){ let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const dishCount = n => Math.min(5, 2 + Math.floor((n - 1) / 2));
function stageConfig(shopId, week, n, players){
  const shop = shopOf(shopId), rnd = rngOf(hashStr(`${shopId}:${week}:${n}`));
  const solo = players <= 1, cnt = dishCount(n);
  const pool = shop.dishes.slice(0, cnt);
  /* 人数が多いほど お客も多く、間かくも短くなります */
  const total = Math.min(32, 5 + Math.ceil(n * 1.2) + (players - 1) * 2);
  const maxActive = Math.min(4, 2 + Math.floor((n - 1) / 3) + (players >= 3 ? 1 : 0));
  const patience = Math.round(Math.max(50, 95 - n * 3) * (solo ? 1.35 : 1) * 1000);
  const gap = Math.round(Math.max(4.5, 11 - n * .5) * (solo ? 1.35 : 1) * (players >= 3 ? .85 : 1) * 1000);
  const animals = Object.keys(ANIMALS);
  const queue = [], load = {cut:0, cook:0};
  const work = d => ({cut:d.comps.filter(c => ING[c].steps.includes('cut')).length * 1.4, cook:d.comps.filter(c => ING[c].steps.includes('cook')).length});
  for (let i = 0; i < total; i++){
    // あたらしい料理が少し多めに出ます
    /* 切る・焼くの仕事量が かたよらないように、少ない方を使う料理を出やすくします */
    const lack = load.cut <= load.cook ? 'cut' : 'cook';
    const weights = pool.map((d, j) => (j === pool.length - 1 && cnt > 1 ? 2.2 : 1) * (work(d)[lack] ? 2.5 : 1));
    let r = rnd() * weights.reduce((a, b) => a + b, 0), k = 0;
    while (r > weights[k]){ r -= weights[k]; k++; }
    const pick = pool[Math.min(k, pool.length - 1)], wk = work(pick); load.cut += wk.cut; load.cook += wk.cook;
    queue.push({dish:pick.id, animal:animals[Math.floor(rnd() * animals.length)]});
  }
  /* 最初の2人で「切る」と「焼く」の両方が必要になるように並べかえます */
  const uses = (id, step) => shop.dishes.find(d => d.id === id).comps.some(c => ING[c].steps.includes(step));
  for (const step of ['cut', 'cook']){
    if (queue.slice(0, 2).some(q => uses(q.dish, step))) continue;
    const j = queue.findIndex((q, i) => i >= 2 && uses(q.dish, step));
    const alt = pool.find(d => uses(d.id, step));
    if (j >= 0){ const t = queue[j]; queue[j] = queue[1]; queue[1] = t; }
    else if (alt && queue[1]) queue[1].dish = alt.id;
  }
  /* 急ぎのお客（待てる時間が短いかわりに、コインが多い） */
  queue.forEach((q, i) => { if (n >= 2 && i >= 2 && rnd() < Math.min(.3, .12 + n * .015)) q.hurry = 1; });
  /* ラッシュ：途中で何人か続けて来ます */
  let rush = 0;
  if (n >= 3){ rush = Math.min(6, 3 + Math.floor(n / 4)); const r0 = Math.floor(total * .45); for (let i = r0; i < Math.min(total, r0 + rush); i++) queue[i].rush = 1; }
  const hurry = queue.filter(q => q.hurry).length;
  const newDish = n === 1 ? pool[pool.length - 1].id : dishCount(n) > dishCount(n - 1) ? pool[pool.length - 1].id : '';
  return {total, maxActive, patience, gap, queue, newDish, rush, hurry, dishes:pool.map(d => d.id)};
}

/* =====================================================================
   ゲームのしくみ（ホストの端末だけが進めます。ほかの端末は結果を表示します）
   ===================================================================== */
const BURN = 9000;          // できあがりから こげるまで
/* やさしい：連打が少なく、焦げにくく、お客が長く待つ */
const isEasy = st => !!st && st.diff === 'easy';
const chopN = (c, st) => { const n = ING[c].chop || 4; return isEasy(st) ? Math.max(2, Math.ceil(n * .6)) : n; };   // 何回たたくと切れるか
const burnMs = st => isEasy(st) ? BURN * 1.8 : BURN;
const BOARDS = 2;           // まないたの数
const PANS = 3;             // オーブン・コンロの数
const CAP = {cutq:4, cookq:4, tray:8};
const ACTIVE_STATES = ['wait'];
/* 仲間に送るひとこと */
const STAMPS = {thx:{t:'ありがとう', c:'#e2456f'}, nice:{t:'ナイス', c:'#2e9a6b'}, fast:{t:'急いで', c:'#e0913a'}, help:{t:'手伝って', c:'#3a87d4'}, wait:{t:'待って', c:'#8a7a6a'}, ok:{t:'了解', c:'#2b2520'}};

function newRoomState(code, hostPid){
  const wk = weekInfo();
  return {v:1, code, host:hostPid, phase:'lobby', now:Date.now(), seq:0,
    week:wk.w, shop:wk.shop.id, theme:wk.theme.id, stage:1,
    players:{}, orders:[], items:[], queue:[], cfg:null, fx:[], fxSeq:0,
    coins:0, served:0, missed:0, result:null, uid:1, diff:LSJ.get('nk:diff', 'normal')};
}
const nid = st => 'i' + (st.uid++).toString(36);
const nextLoc = (c, s) => { const st = ING[c].steps[s]; return st === 'cut' ? 'cutq' : st === 'cook' ? 'cookq' : 'tray'; };
const locCount = (st, loc) => st.items.filter(i => i.loc === loc).length;
function bump(st, pid, k){ if (!pid) return; st.stats = st.stats || {}; const s = st.stats[pid] = st.stats[pid] || {}; s[k] = (s[k] || 0) + 1; }
function fx(st, type, data = {}){ st.fx.push(Object.assign({id:++st.fxSeq, type, at:st.now}, data)); if (st.fx.length > 14) st.fx.splice(0, st.fx.length - 14); }
const activeOrders = st => st.orders.filter(o => o.state === 'wait').sort((a, b) => a.at - b.at);
const orderNeeds = (st, o) => { const d = dishOf(st.shop, o.dish), left = [...d.comps]; o.plate.forEach(c => { const i = left.indexOf(c); if (i >= 0) left.splice(i, 1); }); return left; };
const orderDone = (st, o) => orderNeeds(st, o).length === 0;

/* いま必要な材料の数（作っているとちゅうのものは差し引きます） */
function needCounts(st){
  const need = {};
  activeOrders(st).forEach(o => orderNeeds(st, o).forEach(c => { need[c] = (need[c] || 0) + 1; }));
  st.items.forEach(i => { if (need[i.c]) need[i.c]--; });
  Object.keys(need).forEach(k => { if (need[k] <= 0) delete need[k]; });
  return need;
}

function balanceRoles(st){
  const ids = Object.keys(st.players).sort((a, b) => (st.players[a].joined || 0) - (st.players[b].joined || 0));
  if (ids.length <= 1) return;
  const cnt = r => ids.filter(id => (st.players[id].roles || []).includes(r)).length;
  ids.forEach(id => {
    const p = st.players[id];
    if ((p.roles || []).length) return;
    const r = ROLE_IDS.slice().sort((a, b) => cnt(a) - cnt(b))[0];
    p.roles = [r]; p.auto = true;
  });
}
function startStage(st, n){
  balanceRoles(st);
  const players = Math.max(1, Object.keys(st.players).length);
  const wk = weekInfo();
  if (wk.w !== st.week){ st.week = wk.w; st.shop = wk.shop.id; st.theme = wk.theme.id; }
  st.stage = n;
  st.cfg = stageConfig(st.shop, st.week, n, players);
  if (isEasy(st)){ st.cfg.patience = Math.round(st.cfg.patience * 1.4); st.cfg.gap = Math.round(st.cfg.gap * 1.15); }
  st.queue = st.cfg.queue.slice(); delete st.cfg.queue;
  st.orders = []; st.items = []; st.streak = 0; st.lastServe = 0; st.stats = {}; st.maxStreak = 0; st.hurryServed = 0; st.rushOn = false; st.coins = 0; st.served = 0; st.missed = 0; st.result = null;
  st.phase = 'intro'; st.introUntil = st.now + (st.cfg.newDish ? 6500 : 3500);
  fx(st, 'intro');
}

/* 時間の進み（ホストが 0.1 秒ごとに呼びます）。変化があれば true */
function tick(st, now){
  st.now = now;
  let ch = false;
  if (st.phase === 'intro' && now >= st.introUntil){ st.phase = 'play'; st.startAt = now; st.nextAt = now + 1200; fx(st, 'start'); ch = true; }
  if (st.phase !== 'play') return ch;
  const act = activeOrders(st);
  if (st.queue.length && act.length < st.cfg.maxActive + (st.queue[0].rush ? 1 : 0) && (now >= st.nextAt || act.length === 0 && now >= st.nextAt - st.cfg.gap + 2500)){
    const q = st.queue.shift(), pat = Math.round(st.cfg.patience * (q.hurry ? .55 : 1));
    const o = {id:nid(st), dish:q.dish, animal:q.animal, at:now, until:now + pat, pat, plate:[], state:'wait'};
    if (q.hurry) o.hurry = 1;
    st.orders.push(o); st.nextAt = now + st.cfg.gap * (q.rush ? .3 : 1); fx(st, 'arrive', {o:o.id}); ch = true;
    if (q.rush && !st.rushOn){ st.rushOn = true; fx(st, 'rush'); }
    if (!q.rush) st.rushOn = false;
  }
  for (const o of st.orders){
    if (o.state === 'wait' && now > o.until){ o.state = 'left'; o.leaveAt = now + 1800; st.missed++; fx(st, 'left', {o:o.id}); ch = true; }
  }
  const before = st.orders.length;
  st.orders = st.orders.filter(o => o.state === 'wait' || now < o.leaveAt);
  if (st.orders.length !== before) ch = true;
  for (const it of st.items){
    if (it.loc !== 'pan') continue;
    if (!it.done && now >= it.cs + ING[it.c].cook){ it.done = true; fx(st, 'cooked', {i:it.id}); ch = true; }
    if (!it.burnt && now >= it.cs + ING[it.c].cook + burnMs(st)){ it.burnt = true; fx(st, 'burnt', {i:it.id}); ch = true; }
  }
  if (!st.queue.length && !st.orders.length){
    const total = st.cfg.total, ratio = st.served / total;
    const stars = ratio >= .9 ? 3 : ratio >= .6 ? 2 : 1;
    st.result = {stars, served:st.served, total, coins:st.coins, stage:st.stage, shop:st.shop, week:st.week, stats:st.stats || {}, maxStreak:st.maxStreak || 0, hurryServed:st.hurryServed || 0};
    st.phase = 'result'; st.items = []; fx(st, 'result'); ch = true;
  }
  return ch;
}
/* まないたが空いたら、待っているものを自動でのせます */
function fillBoards(st){
  for (let b = 0; b < BOARDS; b++){
    if (st.items.some(i => i.loc === 'board' && i.slot === b)) continue;
    const it = st.items.find(i => i.loc === 'cutq'); if (!it) return;
    it.loc = 'board'; it.slot = b; it.chop = 0;
  }
}
function moveNext(st, it){
  it.s++; delete it.slot; delete it.chop; delete it.cs; delete it.done; delete it.burnt;
  it.loc = nextLoc(it.c, it.s);
  if (it.loc !== 'tray' && it.loc !== 'cutq' && it.loc !== 'cookq') it.loc = 'tray';
}

/* プレイヤーの操作を反映します。結果 {ok, why} */
function apply(st, a, pid){
  const P = st.players[pid];
  if (a.t === 'roles' && P){ P.roles = (a.roles || []).filter(r => ROLE_IDS.includes(r)); return {ok:true}; }
  if (a.t === 'start' && pid === st.host && (st.phase === 'lobby' || st.phase === 'result')){ startStage(st, Math.max(1, a.stage | 0 || st.stage)); return {ok:true}; }
  if (a.t === 'diff' && pid === st.host && st.phase !== 'play' && st.phase !== 'intro'){ st.diff = a.v === 'easy' ? 'easy' : 'normal'; return {ok:true}; }
  if (a.t === 'lobby' && pid === st.host){ st.phase = 'lobby'; st.orders = []; st.items = []; st.result = null; return {ok:true}; }
  if (a.t === 'stamp' && P && STAMPS[a.k]){ if (st.now - (P.lastStamp || 0) < 900) return {ok:false}; P.lastStamp = st.now; fx(st, 'stamp', {k:a.k, p:pid}); return {ok:true}; }
  if (st.phase !== 'play') return {ok:false, why:'notplay'};
  const shop = shopOf(st.shop);
  const item = a.i ? st.items.find(i => i.id === a.i) : null;
  switch (a.t){
    case 'take': {
      if (!shop.ings.includes(a.c)) return {ok:false};
      const loc = nextLoc(a.c, 0);
      if (locCount(st, loc) >= CAP[loc]){ fx(st, 'full', {loc, p:pid}); return {ok:false, why:'full', loc}; }
      st.items.push({id:nid(st), c:a.c, s:0, loc, by:pid});
      fillBoards(st); fx(st, 'take', {c:a.c, p:pid}); bump(st, pid, 'take');
      return {ok:true, loc};
    }
    case 'chop': {
      if (!item || item.loc !== 'board') return {ok:false};
      item.chop = (item.chop || 0) + 1;
      if (item.chop >= chopN(item.c, st)){ moveNext(st, item); fx(st, 'cut', {c:item.c, p:pid}); bump(st, pid, 'cut'); fillBoards(st); }
      return {ok:true};
    }
    case 'cook': {
      if (!item || item.loc !== 'cookq') return {ok:false};
      const used = new Set(st.items.filter(i => i.loc === 'pan').map(i => i.slot));
      let slot = -1; for (let s = 0; s < PANS; s++) if (!used.has(s)){ slot = s; break; }
      if (slot < 0){ fx(st, 'full', {loc:'pan', p:pid}); return {ok:false, why:'full'}; }
      item.loc = 'pan'; item.slot = slot; item.cs = st.now; item.done = false;
      fx(st, 'cookin', {c:item.c, p:pid});
      return {ok:true};
    }
    case 'out': {
      if (!item || item.loc !== 'pan' || st.now < item.cs + ING[item.c].cook) return {ok:false};
      if (item.burnt){ st.items = st.items.filter(i => i !== item); fx(st, 'toss', {p:pid}); return {ok:true, burnt:true}; }
      moveNext(st, item); fillBoards(st); fx(st, 'out', {c:item.c, p:pid}); bump(st, pid, 'cook');
      return {ok:true};
    }
    case 'plate': {
      if (!item || item.loc !== 'tray') return {ok:false};
      let o = a.o ? st.orders.find(x => x.id === a.o && x.state === 'wait' && orderNeeds(st, x).includes(item.c)) : null;
      if (!o) o = activeOrders(st).find(x => orderNeeds(st, x).includes(item.c));
      if (!o){ fx(st, 'nope', {i:item.id, p:pid}); return {ok:false, why:'nope'}; }
      o.plate.push(item.c); st.items = st.items.filter(i => i !== item);
      fx(st, 'plate', {o:o.id, c:item.c, p:pid}); bump(st, pid, 'plate');
      return {ok:true, o:o.id};
    }
    case 'serve': {
      const o = st.orders.find(x => x.id === a.o);
      if (!o || o.state !== 'wait' || !orderDone(st, o)) return {ok:false};
      const d = dishOf(st.shop, o.dish), left = Math.max(0, (o.until - st.now) / (o.pat || st.cfg.patience));
      /* 続けて出すと連続ボーナス */
      st.streak = st.now - (st.lastServe || 0) < 12000 ? (st.streak || 0) + 1 : 1; st.lastServe = st.now;
      const coins = Math.round((d.comps.length * 10 + Math.round(left * 10) * 2) * (o.hurry ? 1.5 : 1)) + (st.streak >= 2 ? Math.min(5, st.streak - 1) * 5 : 0);
      o.state = 'happy'; o.leaveAt = st.now + 1800; o.coins = coins;
      st.coins += coins; st.served++;
      st.maxStreak = Math.max(st.maxStreak || 0, st.streak); if (o.hurry) st.hurryServed = (st.hurryServed || 0) + 1;
      fx(st, 'serve', {o:o.id, coins, p:pid, streak:st.streak}); bump(st, pid, 'serve');
      return {ok:true};
    }
    case 'trash': {
      if (!item || !['tray', 'cutq', 'cookq', 'pan'].includes(item.loc)) return {ok:false};
      st.items = st.items.filter(i => i !== item); fx(st, 'trash', {p:pid});
      return {ok:true};
    }
  }
  return {ok:false};
}

/* その人の画面に出す係（自分で選んだ係＋だれも選んでいない係） */
function myStations(st, pid){
  const ps = Object.values(st.players), me = st.players[pid];
  const owned = new Set(); ps.forEach(p => (p.roles || []).forEach(r => owned.add(r)));
  const mine = new Set(me && me.roles || []);
  ROLE_IDS.forEach(r => { if (!owned.has(r)) mine.add(r); });
  if (!mine.size) ROLE_IDS.forEach(r => mine.add(r));
  return ROLE_IDS.filter(r => mine.has(r));
}

/* =====================================================================
   オンライン（ログインなし・合言葉の部屋）
   Firestore：nakayoshiKitchen/{合言葉}            … ゲームの状態（ホストだけが書きます）
             nakayoshiKitchen/{合言葉}/p/{id}     … 参加している人（名前・係・きせかえ）
             nakayoshiKitchen/{合言葉}/a/{id}     … 操作（ホストが読み取って反映します）
   ===================================================================== */
const ROOT = 'nakayoshiKitchen';
const NET = {mode:'off', code:'', isHost:false, st:null, unsub:[], processed:new Set(), pushT:null, lastPush:0, loopT:null, hbT:null,
  lastRecv:0, lastUpd:0, offset:0, pdocs:{}, actN:0, hostSince:0, onChange:null};
const PID = (() => { let p = localStorage.getItem('nk:pid'); if (!p){ p = 'p' + Math.random().toString(36).slice(2, 9); localStorage.setItem('nk:pid', p); } return p; })();
const hostNow = () => Date.now() + (NET.isHost ? 0 : NET.offset);
function whenFB(){ return new Promise((res, rej) => { if (window.FBX) return res(); const to = setTimeout(() => rej(new Error('offline')), 9000); window.addEventListener('fbx-ready', () => { clearTimeout(to); res(); }, {once:true}); }); }
const roomRef = code => FBX.doc(FBX.db, ROOT, code);
const meDoc = () => ({name:ME.name, color:ME.color, hat:ME.hat, skin:ME.skin, roles:ME.roles, joined:NET.joined || Date.now(), last:Date.now()});

function netChanged(){
  const st = NET.st; if (!st) return;
  st.seq++;
  if (NET.onChange) NET.onChange();
  if (NET.mode === 'room' && NET.isHost) schedulePush();
}
function schedulePush(force){
  clearTimeout(NET.pushT);
  const wait = force ? 0 : Math.max(0, 300 - (Date.now() - NET.lastPush));
  NET.pushT = setTimeout(pushState, wait);
}
async function pushState(){
  if (NET.mode !== 'room' || !NET.isHost || !NET.st) return;
  NET.lastPush = Date.now(); NET.st.now = Date.now();
  try{ await FBX.setDoc(roomRef(NET.code), {s:JSON.stringify(NET.st), host:PID, upd:Date.now()}); }
  catch(e){ console.warn('push', e); }
}
/* ホストの進行（0.1秒ごと） */
function hostLoop(){
  clearInterval(NET.loopT);
  NET.loopT = setInterval(() => {
    const st = NET.st; if (!st || !NET.isHost) return;
    let ch = tick(st, Date.now());
    if (NET.mode === 'room'){
      // しばらく応答のない人は、部屋から外します
      const now = Date.now();
      Object.keys(st.players).forEach(id => { if (id !== PID && (!NET.pdocs[id] || now - NET.pdocs[id].last > 25000)){ delete st.players[id]; ch = true; } });
      if (now - NET.lastPush > 2500) schedulePush();
    }
    if (ch) netChanged();
  }, 100);
}
function stopNet(){
  NET.unsub.forEach(f => { try{ f(); }catch(e){} }); NET.unsub = [];
  clearInterval(NET.loopT); clearInterval(NET.hbT); clearTimeout(NET.pushT);
  NET.mode = 'off'; NET.isHost = false; NET.st = null; NET.code = ''; NET.pdocs = {}; NET.processed = new Set();
}

/* ---------- ひとりで ---------- */
function soloStart(){
  stopNet();
  NET.mode = 'solo'; NET.isHost = true; NET.joined = Date.now();
  NET.st = newRoomState('', PID);
  NET.st.players[PID] = Object.assign(meDoc(), {roles:ROLE_IDS.slice()});
  NET.st.stage = nextStageFor(NET.st.week);
  hostLoop();
}

/* ---------- 部屋をつくる ---------- */
async function createRoom(){
  await whenFB();
  stopNet();
  let code = '';
  for (let i = 0; i < 12; i++){
    const c = String(1000 + Math.floor(Math.random() * 9000));
    const snap = await FBX.getDoc(roomRef(c));
    if (!snap.exists() || Date.now() - (snap.data().upd || 0) > 6 * 3600e3){ code = c; break; }
  }
  if (!code) throw new Error('部屋を作れなかった');
  NET.mode = 'room'; NET.code = code; NET.isHost = true; NET.joined = Date.now(); NET.hostSince = Date.now();
  NET.st = newRoomState(code, PID);
  NET.st.players[PID] = meDoc();
  NET.st.stage = nextStageFor(NET.st.week);
  await FBX.setDoc(roomRef(code), {s:JSON.stringify(NET.st), host:PID, upd:Date.now()});
  await FBX.setDoc(FBX.doc(FBX.db, ROOT, code, 'p', PID), meDoc());
  subscribe();
  hostLoop();
  return code;
}
/* ---------- 部屋にはいる ---------- */
async function joinRoom(code){
  await whenFB();
  stopNet();
  const snap = await FBX.getDoc(roomRef(code));
  if (!snap.exists() || Date.now() - (snap.data().upd || 0) > 6 * 3600e3) throw new Error('nf');
  NET.mode = 'room'; NET.code = code; NET.joined = Date.now();
  const st = JSON.parse(snap.data().s);
  NET.isHost = st.host === PID;
  NET.st = st; NET.offset = (st.now || Date.now()) - Date.now(); NET.lastRecv = Date.now();
  await FBX.setDoc(FBX.doc(FBX.db, ROOT, code, 'p', PID), meDoc());
  subscribe();
  if (NET.isHost){ NET.hostSince = Date.now(); hostLoop(); }
}
function subscribe(){
  const code = NET.code;
  NET.unsub.push(FBX.onSnapshot(roomRef(code), snap => {
    if (!snap.exists()) return;
    const d = snap.data();
    NET.lastRecv = Date.now();
    if (NET.isHost && d.host === PID) return;                 // 自分が書いたもの
    if (NET.isHost && d.host !== PID){ NET.isHost = false; clearInterval(NET.loopT); }   // ほかの人がホストを引きついだ
    let st; try{ st = JSON.parse(d.s); }catch(e){ return; }
    NET.offset = (st.now || d.upd) - Date.now();
    NET.st = st;
    if (NET.onChange) NET.onChange();
  }));
  NET.unsub.push(FBX.onSnapshot(FBX.collection(FBX.db, ROOT, code, 'p'), snap => {
    const m = {}; snap.forEach(x => { m[x.id] = x.data(); });
    NET.pdocs = m;
    if (NET.isHost && NET.st){
      let ch = false;
      Object.entries(m).forEach(([id, p]) => {
        if (Date.now() - (p.last || 0) > 25000 && id !== PID) return;
        const cur = NET.st.players[id], keep = cur && cur.auto && !(p.roles && p.roles.length);
        const np = {name:p.name, color:p.color, hat:p.hat, skin:p.skin, roles:keep ? cur.roles : (p.roles || []), joined:p.joined || 0};
        if (keep) np.auto = true;
        if (!cur || JSON.stringify(cur) !== JSON.stringify(np)){ NET.st.players[id] = np; ch = true; }
      });
      if (ch) netChanged();
    }
  }));
  NET.unsub.push(FBX.onSnapshot(FBX.collection(FBX.db, ROOT, code, 'a'), snap => {
    if (!NET.isHost || !NET.st) { snap.forEach(x => NET.processed.add(x.id)); return; }
    let ch = false;
    snap.forEach(x => {
      if (NET.processed.has(x.id)) return;
      NET.processed.add(x.id);
      const v = x.data(); if (!v || v.t < NET.hostSince - 4000) return;
      let a; try{ a = JSON.parse(v.a); }catch(e){ return; }
      NET.st.now = Date.now();
      apply(NET.st, a, v.p); ch = true;
    });
    if (ch) netChanged();
  }));
  clearInterval(NET.hbT);
  NET.hbT = setInterval(() => {
    if (NET.mode !== 'room') return;
    FBX.setDoc(FBX.doc(FBX.db, ROOT, NET.code, 'p', PID), {last:Date.now()}, {merge:true}).catch(() => {});
    checkTakeover();
  }, 4000);
}
/* ホストの端末がいなくなったら、いちばん先に入った人が引きつぎます */
function checkTakeover(){
  if (NET.isHost || NET.mode !== 'room' || !NET.st) return;
  if (Date.now() - NET.lastRecv < 9000) return;
  const now = Date.now();
  const alive = Object.entries(NET.pdocs).filter(([id, p]) => id !== NET.st.host && now - (p.last || 0) < 12000).sort((a, b) => (a[1].joined || 0) - (b[1].joined || 0));
  if (!alive.length || alive[0][0] !== PID) return;
  NET.isHost = true; NET.hostSince = Date.now();
  const st = NET.st; st.host = PID; st.now = Date.now();
  if (st.phase === 'play') Object.values(st.orders).forEach(o => { if (o.state === 'wait') o.until += 6000; });   // 待たせたぶん、少しのばします
  fx(st, 'host', {p:PID});
  hostLoop(); schedulePush(true);
  if (NET.onChange) NET.onChange();
}
/* 操作を送ります（ホストならその場で反映） */
function send(a){
  if (!NET.st) return {ok:false};
  if (NET.isHost){ NET.st.now = Date.now(); const r = apply(NET.st, a, PID); netChanged(); return r; }
  const id = `${PID}-${Date.now().toString(36)}-${(NET.actN++).toString(36)}`;
  FBX.setDoc(FBX.doc(FBX.db, ROOT, NET.code, 'a', id), {p:PID, a:JSON.stringify(a), t:Date.now()}).catch(e => console.warn('act', e));
  return {ok:true, pending:true};
}
function updateMe(){
  if (!NET.st) return;
  if (NET.mode === 'room') FBX.setDoc(FBX.doc(FBX.db, ROOT, NET.code, 'p', PID), meDoc(), {merge:true}).catch(() => {});

}

   音（効果音と BGM をその場で作ります）

const SND = {ctx:null, master:null, sfx:null, bgm:null, on:localStorage.getItem('nk:sound') !== '0', music:localStorage.getItem('nk:music') !== '0', bgmT:null, step:0, song:-1, nextT:0};
function actx(){
  if (!SND.ctx){
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null;
    SND.ctx = new AC(); SND.master = SND.ctx.createGain(); SND.master.gain.value = .9; SND.master.connect(SND.ctx.destination);
    SND.sfx = SND.ctx.createGain(); SND.sfx.gain.value = .8; SND.sfx.connect(SND.master);
    SND.bgm = SND.ctx.createGain(); SND.bgm.gain.value = .16; SND.bgm.connect(SND.master);
  }
  if (SND.ctx.state !== 'running') SND.ctx.resume();
  return SND.ctx;
}
document.addEventListener('pointerdown', () => { const c = actx(); if (c){ const b = c.createBuffer(1, 1, 22050), s = c.createBufferSource(); s.buffer = b; s.connect(c.destination); s.start(0); } }, {passive:true});
function tone(f, t, d, type = 'sine', v = .3, out, slide){
  const c = SND.ctx, o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + d);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .012); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g).connect(out || SND.sfx); o.start(t); o.stop(t + d + .05);
}
let noiseBuf = null;
function noise(t, d, v = .3, freq = 2000, q = 1, out){
  const c = SND.ctx;
  if (!noiseBuf){ noiseBuf = c.createBuffer(1, c.sampleRate * .5, c.sampleRate); const ch = noiseBuf.getChannelData(0); for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1; }
  const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
  s.buffer = noiseBuf; f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  s.connect(f).connect(g).connect(out || SND.sfx); s.start(t); s.stop(t + d + .05);
}
const SFX = {
  tap:t => tone(880, t, .08, 'sine', .18),
  pop:t => { tone(520, t, .12, 'sine', .28, null, 980); },
  take:t => { tone(660, t, .1, 'triangle', .25); tone(990, t + .06, .12, 'sine', .2); },
  chop:t => { noise(t, .07, .5, 3200, 2); tone(180, t, .06, 'square', .08); },
  cut:t => { noise(t, .06, .4, 3600, 2); tone(784, t + .05, .12, 'sine', .22); tone(1175, t + .12, .16, 'sine', .2); },
  cookin:t => { noise(t, .35, .18, 1200, .6); tone(330, t, .1, 'sine', .15); },
  cooked:t => { [1318, 1760].forEach((f, i) => tone(f, t + i * .12, .35, 'sine', .22)); },
  out:t => { tone(587, t, .1, 'triangle', .25); tone(880, t + .07, .14, 'triangle', .22); },
  plate:t => { tone(1046, t, .08, 'sine', .22); tone(1568, t + .05, .14, 'sine', .14); },
  serve:t => { [523, 659, 784, 1046].forEach((f, i) => tone(f, t + i * .08, .3, 'triangle', .26)); },
  arrive:t => { tone(1318, t, .5, 'sine', .2); tone(1046, t + .14, .6, 'sine', .18); },
  left:t => { tone(440, t, .25, 'sine', .2, null, 330); tone(330, t + .2, .35, 'sine', .18, null, 262); },
  nope:t => { tone(220, t, .14, 'square', .1); tone(196, t + .12, .16, 'square', .1); },
  full:t => { tone(260, t, .12, 'triangle', .2); tone(260, t + .16, .12, 'triangle', .2); },
  trash:t => { noise(t, .2, .25, 600, .8); },
  start:t => { [523, 659, 784].forEach((f, i) => tone(f, t + i * .12, .2, 'square', .1)); tone(1046, t + .38, .5, 'square', .12); },
  star:t => { tone(1568, t, .3, 'sine', .25); tone(2093, t + .06, .4, 'sine', .18); },
  clear:t => { [659, 784, 1046, 784, 1046, 1318].forEach((f, i) => tone(f, t + i * .11, .28, 'triangle', .24)); },
  count:t => tone(784, t, .14, 'square', .1)
};
function sfx(name){ if (!SND.on) return; const c = actx(); if (!c) return; try{ SFX[name] && SFX[name](c.currentTime + .01); }catch(e){} }

/* BGM：お店ごとに ちがう曲（かんたんな マリンバふう） */
const SONGS = [
  {bpm:112, prog:[[60, 64, 67], [65, 69, 72], [67, 71, 74], [60, 64, 67]], mel:[72, 74, 76, 79, 76, 74, 72, 0, 77, 76, 74, 72, 74, 0, 71, 0, 72, 74, 76, 79, 81, 79, 76, 74, 72, 0, 74, 71, 72, 0, 0, 0]},
  {bpm:100, prog:[[57, 60, 64], [62, 65, 69], [55, 59, 62], [57, 60, 64]], mel:[69, 0, 72, 74, 76, 0, 74, 72, 69, 0, 67, 69, 72, 0, 0, 0, 74, 0, 76, 79, 81, 0, 79, 76, 74, 72, 69, 0, 72, 69, 0, 0]},
  {bpm:120, prog:[[65, 69, 72], [62, 65, 69], [70, 74, 77], [72, 76, 79]], mel:[77, 76, 77, 81, 84, 0, 81, 77, 79, 0, 77, 74, 76, 0, 0, 0, 77, 79, 81, 84, 86, 84, 81, 79, 77, 0, 76, 74, 77, 0, 0, 0]},
  {bpm:128, prog:[[55, 59, 62], [60, 64, 67], [62, 66, 69], [55, 59, 62]], mel:[67, 0, 67, 71, 74, 0, 71, 67, 72, 0, 72, 76, 74, 0, 0, 0, 79, 78, 76, 74, 76, 0, 74, 71, 72, 71, 69, 0, 67, 0, 0, 0]}
];
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
function bgmStart(i){
  if (!SND.music || !SND.on){ bgmStop(); return; }
  const c = actx(); if (!c) return;
  if (SND.song === i && SND.bgmT) return;
  bgmStop(); SND.song = i; SND.step = 0; SND.nextT = c.currentTime + .1;
  SND.bgmT = setInterval(() => {
    const song = SONGS[SND.song] || SONGS[0], spb = 60 / song.bpm / 2;
    while (SND.nextT < c.currentTime + .25){
      const s = SND.step, t = SND.nextT, bar = Math.floor(s / 8) % song.prog.length, ch = song.prog[bar];
      const m = song.mel[s % song.mel.length];
      if (m) { tone(mtof(m), t, .32, 'sine', .32, SND.bgm); tone(mtof(m + 12), t, .12, 'sine', .06, SND.bgm); }
      if (s % 4 === 0) tone(mtof(ch[0] - 12), t, .5, 'triangle', .38, SND.bgm);
      if (s % 4 === 2) ch.forEach(n => tone(mtof(n), t, .18, 'sine', .08, SND.bgm));
      if (s % 2 === 1) noise(t, .03, .12, 8000, 1, SND.bgm);
      SND.step++; SND.nextT += spb;
    }
  }, 60);
}
function bgmStop(){ clearInterval(SND.bgmT); SND.bgmT = null; SND.song = -1; }

  const stepIcons = c => ING[c].steps.map(s => `<span class="arrow">›</span><div class="step"><div class="r">${ROLE_ART[s === 'cut' ? 'kiru' : 'yaku']()}</div>${s === 'cut' ? '切る' : '焼く'}</div>`).join('');
  return `<div class="newdish"><div class="nm">${esc(d.name)}</div>${d.comps.map((c, i) => `${i ? '<span class="plus">＋</span>' : ''}<div class="recipe-row"><div class="step"><div class="a">${A[ING[c].raw]()}</div>${esc(ING[c].name)}</div>${stepIcons(c)}</div>`).join('')}
    <span class="plus">＝</span><div class="step eq"><div class="a">${D[d.id]()}</div></div></div>`;
}
function showIntro(){
  const st = NET.st, shop = shopOf(st.shop), th = THEMES.find(t => t.id === st.theme) || THEMES[0];
  const list = st.stage === 1 && st.cfg ? st.cfg.dishes.map(id => dishOf(st.shop, id)) : st.cfg && st.cfg.newDish ? [dishOf(st.shop, st.cfg.newDish)] : [];
  overlay(`<div class="sign">${esc(th.name + shop.name)}</div><h3>ステージ ${st.stage}</h3>
    ${list.length ? `<div class="lead">${st.stage === 1 ? 'メニュー' : '新メニュー'}</div><div class="menus">${list.map(recipeHTML).join('')}</div>` : ''}
    <div class="lead">${isEasy(st) ? 'やさしい・' : ''}お客 ${st.cfg ? st.cfg.total : ''}人${st.cfg && st.cfg.hurry ? `・急ぎ ${st.cfg.hurry}人` : ''}${st.cfg && st.cfg.rush ? '・ラッシュあり' : ''}</div><div class="countdown" id="cd"></div>`);
}
function statsHTML(st, r){
  const ids = Object.keys(st.players).filter(id => r.stats && r.stats[id]);
  if (ids.length < 2) return '';
  const K = [['take', '材料'], ['cut', '切る'], ['cook', '焼く'], ['plate', '盛る'], ['serve', '渡す']];
  const score = id => K.reduce((a, [k]) => a + (r.stats[id][k] || 0), 0), best = ids.reduce((a, b) => score(b) > score(a) ? b : a);
  return `<div class="stats">${ids.map(id => { const p = st.players[id], s = r.stats[id];
    return `<div class="srow ${id === best ? 'mvp' : ''}"><i>${pArt(p, 'happy')}</i><b>${esc(p.name)}</b>${id === best ? '<em>大活躍</em>' : ''}<span>${K.filter(([k]) => s[k]).map(([k, t]) => `${t} ${s[k]}`).join('　')}</span></div>`; }).join('')}</div>`;
}
function showResult(){
  const st = NET.st, r = st.result; if (!r) return;
  const key = `${r.week}:${r.stage}:${st.fxSeq}`;
  let unlocked = [];
  if (resultDone !== key){ resultDone = key; unlocked = recordResult(r); }
  const host = NET.isHost;
  const o = overlay(`<h3>${r.stars >= 3 ? '大成功' : r.stars === 2 ? '成功' : 'クリア'}</h3>
    <div class="stars">${[0, 1, 2].map(i => `<i data-on="${i < r.stars ? 1 : 0}">${ICON.star(i < r.stars)}</i>`).join('')}</div>
    <div class="res-row"><span class="pill"><i>${ICON.heart()}</i>笑顔 ${r.served}/${r.total}</span><span class="pill"><i>${ICON.coin()}</i>${r.coins}${lastRecord ? '<em class="rec">新記録</em>' : ''}</span><span class="pill sub">最高 ${COINBEST[`${r.week}:${r.stage}`] || r.coins}</span><span class="pill"><i>${ICON.star()}</i>合計 ${totalStars()}</span></div>
    ${lastChal ? `<div class="chalok"><small>今週のチャレンジ達成</small><b>${esc(challengeOf(r.week).desc)}</b><span>★3</span></div>` : ''}
    ${statsHTML(st, r)}
    ${unlocked.map(h => `<div class="unlock"><div class="av">${chef({color:ME.color, hat:h.id, skin:ME.skin, mood:'happy'})}</div><div style="text-align:left"><small>新しい着せ替え</small><br><b>${esc(h.name)}</b></div></div>`).join('')}
    <div class="ov-btns">${host ? `<button class="btn" data-r="lobby">${NET.mode === 'solo' ? '終了' : '部屋へ'}</button><button class="btn yellow" data-r="again">もう一度</button><button class="btn big green" data-r="next">次のステージ</button>`
      : `<div class="waitmsg">ホストの選択待ち</div><button class="btn" data-r="leave">退出</button>`}</div>`);
  $$('.stars i', o).forEach((s, i) => setTimeout(() => { s.classList.add('in'); if (s.dataset.on === '1') sfx('star'); }, 500 + i * 380));
  o.onclick = async e => {
    const b = e.target.closest('[data-r]'); if (!b) return;
    sfx('tap');
    const a = b.dataset.r;
    if (a === 'next'){ lobbyStage = 0; send({t:'start', stage:r.stage + 1}); }
    if (a === 'again') send({t:'start', stage:r.stage});
    if (a === 'lobby'){ if (NET.mode === 'solo'){ stopNet(); closeOv(); bgmStop(); renderTitle(); } else send({t:'lobby'}); }
    if (a === 'leave'){ await leaveRoom(); closeOv(); bgmStop(); renderTitle(); }
  };
}

/* ---------- 起動 ---------- */
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault(), {passive:false});
(function boot(){
  const room = new URLSearchParams(location.search).get('room');
  renderTitle();
  if (room && /^\d{4}$/.test(room)){ history.replaceState(null, '', location.pathname); renderJoin(room); }
})();

</script>
</body>
</html>
